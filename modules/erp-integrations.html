<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreightPOP — ERP & Systems Integrations</title>
<script src="erp-integrations-data.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#051729; color:#fff; font-family:'Manrope','DM Sans',-apple-system,sans-serif; min-height:100vh; padding:52px 60px 40px; overflow-x:hidden; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(700px 700px at 84% -8%,rgba(64,136,207,.28),rgba(64,136,207,.10) 42%,transparent 70%),
               radial-gradient(560px 560px at 4% 108%,rgba(61,214,181,.10),transparent 65%); }
  .wrap { position:relative; max-width:1320px; margin:0 auto; }
  .kicker { font-family:'DM Mono',monospace; font-size:12px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:#3DD6B5; margin-bottom:12px; display:flex; align-items:center; gap:11px; }
  .kicker::before { content:""; width:26px; height:1.5px; background:#3DD6B5; display:inline-block; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:12px; }
  h1 { font-weight:400; font-size:46px; line-height:1.03; letter-spacing:-.02em; }
  .intro { font-size:14px; line-height:1.55; color:#B5CDE0; max-width:520px; font-weight:300; }
  .quicklinks { display:flex; gap:9px; flex-wrap:wrap; margin:16px 0 26px; }
  .quicklinks a { display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border:1px solid rgba(61,214,181,.5); border-radius:999px; color:#3DD6B5; text-decoration:none; font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; transition:background .2s; }
  .quicklinks a:hover { background:rgba(61,214,181,.12); }
  h2 { font-family:'DM Mono',monospace; font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#7A96B0; margin:0 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:26px; }
  .card { position:relative; background:#0A2540; border:1px solid rgba(255,255,255,.10); border-left:5px solid var(--accent,#4c8dde); border-radius:14px; padding:20px 22px; box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
  .card.native { --accent:#3DD6B5; }
  .card.bilateral { --accent:#4c8dde; }
  .card.hardware { --accent:#3AADBC; }
  .card .name { font-weight:600; font-size:19px; letter-spacing:-.01em; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .card .modes { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.05em; color:var(--accent,#4c8dde); margin-top:6px; text-transform:uppercase; }
  .card .tag { font-size:13px; line-height:1.5; color:#B5CDE0; margin-top:11px; }
  .card a { color:var(--accent,#3DD6B5); text-decoration:none; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap; }
  .foot { margin-top:20px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:#7A96B0; }
  .foot b { color:#3DD6B5; font-weight:500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker" id="kicker"></div>
  <div class="head">
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
  </div>
  <div class="quicklinks" id="links"></div>

  <h2>ERP Integrations</h2>
  <div class="grid" id="erps"></div>

  <h2>Hardware & Data Capture</h2>
  <div class="grid" id="hardware"></div>

  <div class="foot"><b>Native</b> = ship from inside your ERP · <b>Bilateral</b> = FreightPOP-driven via your ERP's API · <b>Hardware</b> = device data into FreightPOP. Edit modules/erp-integrations.html — the deck picks it up on reload.</div>
</div>
<script>
  const DATA = window.FP_ERP_DATA || {};
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const flavorClass = (f) => (f === 'native' || f === 'hardware') ? f : 'bilateral';
  document.getElementById('kicker').textContent = DATA.kicker;
  document.getElementById('title').textContent = DATA.title;
  document.getElementById('intro').textContent = DATA.intro;
  document.getElementById('links').innerHTML = (DATA.links || []).map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('');
  const card = (x) => `<div class="card ${flavorClass(x.flavor)}">`
    + `<div class="name"><span>${esc(x.name)}</span>${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">Docs ↗</a>` : ''}</div>`
    + `<div class="modes">${esc(x.modes)}</div>`
    + `<div class="tag">${esc(x.tag)}</div></div>`;
  document.getElementById('erps').innerHTML = (DATA.erps || []).map(card).join('');
  document.getElementById('hardware').innerHTML = (DATA.hardware || []).map(card).join('');
</script>
</body>
</html>
