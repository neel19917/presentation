<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreightPOP — Generated Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:#051729; color:#fff; font-family:'Manrope','DM Sans',-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(900px 900px at 84% -10%,rgba(64,136,207,.24),rgba(64,136,207,.08) 44%,transparent 72%),
               radial-gradient(680px 680px at 4% 110%,rgba(61,214,181,.10),transparent 66%); }
  /* 16:9 slide canvas that scales to fill the stage */
  .slide { position:relative; z-index:1; width:100vw; height:100vh; max-width:calc(100vh * 16 / 9); max-height:calc(100vw * 9 / 16);
    margin:auto; padding:6.2vh 6vw; display:flex; flex-direction:column; }
  .eyebrow { font-family:'DM Mono',monospace; font-size:clamp(11px,1.5vh,15px); font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:#3DD6B5; display:flex; align-items:center; gap:12px; margin-bottom:2.4vh; }
  .eyebrow::before { content:""; width:30px; height:1.5px; background:#3DD6B5; display:inline-block; }
  h1 { font-weight:400; font-size:clamp(30px,6.6vh,72px); line-height:1.04; letter-spacing:-.02em; }
  h2 { font-weight:400; font-size:clamp(24px,4.8vh,52px); line-height:1.08; letter-spacing:-.02em; }
  .sub { font-size:clamp(15px,2.5vh,26px); line-height:1.45; color:#B5CDE0; font-weight:300; margin-top:2.6vh; max-width:46ch; }
  .body-text { font-size:clamp(15px,2.4vh,24px); line-height:1.55; color:#E7F0F8; font-weight:300; margin-top:2.4vh; max-width:60ch; }
  .fill { flex:1; display:flex; flex-direction:column; justify-content:center; }
  ul.bul { list-style:none; margin-top:3vh; display:flex; flex-direction:column; gap:1.8vh; }
  ul.bul li { display:flex; gap:16px; align-items:flex-start; font-size:clamp(15px,2.7vh,27px); line-height:1.4; color:#fff; }
  ul.bul li .ck { flex-shrink:0; width:clamp(20px,2.9vh,30px); height:clamp(20px,2.9vh,30px); border-radius:50%; background:rgba(61,214,181,.14); color:#3DD6B5; display:inline-flex; align-items:center; justify-content:center; font-size:clamp(12px,1.7vh,16px); margin-top:.3vh; }
  .stat { font-family:'Manrope',sans-serif; font-weight:400; font-size:clamp(64px,17vh,180px); line-height:.92; letter-spacing:-.04em; color:#3DD6B5; font-variant-numeric:tabular-nums; text-shadow:0 0 60px rgba(61,214,181,.35); }
  .stat-label { font-size:clamp(16px,2.8vh,30px); color:#B5CDE0; margin-top:2vh; font-weight:300; max-width:34ch; }
  .quote { font-family:'Manrope',sans-serif; font-weight:400; font-size:clamp(24px,4.6vh,50px); line-height:1.22; letter-spacing:-.01em; color:#fff; }
  .quote::before { content:"\201C"; color:#3DD6B5; }
  .quote::after { content:"\201D"; color:#3DD6B5; }
  .attr { font-family:'DM Mono',monospace; font-size:clamp(12px,1.9vh,18px); letter-spacing:.06em; color:#7A96B0; margin-top:3vh; text-transform:uppercase; }
  .cols { display:flex; gap:5vw; margin-top:3vh; }
  .cols > div { flex:1; }
  .cols h3 { font-family:'Manrope',sans-serif; font-weight:500; font-size:clamp(16px,2.4vh,24px); color:#3DD6B5; margin-bottom:1.6vh; }
  table.tbl { width:100%; border-collapse:collapse; margin-top:3vh; font-size:clamp(13px,2vh,22px); }
  table.tbl th { text-align:left; font-family:'DM Mono',monospace; font-weight:500; font-size:clamp(11px,1.5vh,15px); letter-spacing:.08em; text-transform:uppercase; color:#7A96B0; padding:1.2vh 1.2vw; border-bottom:1px solid rgba(255,255,255,.16); }
  table.tbl td { padding:1.4vh 1.2vw; border-bottom:1px solid rgba(255,255,255,.08); color:#E7F0F8; font-variant-numeric:tabular-nums; }
  .logo { position:absolute; top:6.2vh; right:6vw; height:clamp(26px,3.6vh,40px); width:auto; opacity:.95; }
  .foot-cta { margin-top:auto; font-family:'DM Mono',monospace; font-size:clamp(13px,2vh,20px); letter-spacing:.1em; text-transform:uppercase; color:#3DD6B5; display:flex; align-items:center; gap:12px; }
  .pagenum { position:absolute; bottom:5vh; right:6vw; font-family:'DM Mono',monospace; font-size:clamp(10px,1.5vh,14px); color:#5f7595; letter-spacing:.08em; }
  .title-slide { justify-content:center; }
  .title-slide h1 { font-size:clamp(38px,8.5vh,92px); }
  .section-slide { justify-content:center; }
  .section-slide h2 { font-size:clamp(30px,7vh,76px); color:#fff; }
  .err { color:#B5CDE0; font-family:'DM Mono',monospace; font-size:14px; }
</style>
</head>
<body>
<div class="slide" id="slide"><div class="err" id="err">Loading…</div></div>
<script>
  // Load the deck's data file for the requested slug, then render slide i.
  const q = new URLSearchParams(location.search);
  const slug = q.get('deck') || '';
  const idx = parseInt(q.get('i') || '0', 10) || 0;
  const LOGO = 'https://info.freightpop.com/hubfs/FPLogos/full-white-logo.png';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pick = (o, ...keys) => { for (const k of keys) { if (o && o[k] != null && o[k] !== '') return o[k]; } return null; };
  const arr = (v) => Array.isArray(v) ? v : (v == null ? [] : [v]);

  function render(deck) {
    const slide = (deck.slides || [])[idx];
    const el = document.getElementById('slide');
    if (!slide) { document.getElementById('err').textContent = 'No slide ' + idx; return; }
    const layout = (slide.layout || 'content').toLowerCase();
    const total = (deck.slides || []).length;
    const logo = '<img class="logo" src="' + LOGO + '" alt="FreightPOP" onerror="this.style.display=\'none\'">';
    const eyebrow = (txt) => txt ? '<div class="eyebrow">' + esc(txt) + '</div>' : '';
    const pagenum = '<div class="pagenum">' + (idx + 1) + ' / ' + total + '</div>';
    let inner = '';

    if (layout === 'title') {
      el.classList.add('title-slide');
      inner = eyebrow(pick(slide, 'eyebrow', 'kicker') || 'FreightPOP · AI Supply Chain Platform')
        + '<div class="fill title-slide"><h1>' + esc(pick(slide, 'title', 'heading') || deck.title) + '</h1>'
        + (pick(slide, 'subtitle', 'sub', 'body') ? '<p class="sub">' + esc(pick(slide, 'subtitle', 'sub', 'body')) + '</p>' : '') + '</div>';
    } else if (layout === 'section') {
      inner = eyebrow(pick(slide, 'eyebrow', 'kicker'))
        + '<div class="fill section-slide"><h2>' + esc(pick(slide, 'section', 'title', 'heading')) + '</h2>'
        + (pick(slide, 'subtitle', 'sub', 'body') ? '<p class="sub">' + esc(pick(slide, 'subtitle', 'sub', 'body')) + '</p>' : '') + '</div>';
    } else if (layout === 'bullets') {
      const items = arr(pick(slide, 'bullets', 'points', 'items'));
      inner = eyebrow(pick(slide, 'eyebrow', 'kicker'))
        + '<h2>' + esc(pick(slide, 'title', 'heading') || '') + '</h2>'
        + '<div class="fill"><ul class="bul">' + items.map(b => '<li><span class="ck">&#10003;</span><span>' + esc(typeof b === 'string' ? b : pick(b, 'text', 'label', 'title')) + '</span></li>').join('') + '</ul></div>';
    } else if (layout === 'callout') {
      inner = eyebrow(pick(slide, 'eyebrow', 'kicker'))
        + '<div class="fill"><div class="stat">' + esc(pick(slide, 'stat', 'value', 'number')) + '</div>'
        + (pick(slide, 'stat_label', 'label', 'statLabel') ? '<div class="stat-label">' + esc(pick(slide, 'stat_label', 'label', 'statLabel')) + '</div>' : '')
        + (pick(slide, 'supporting_text', 'body', 'sub') ? '<p class="body-text">' + esc(pick(slide, 'supporting_text', 'body', 'sub')) + '</p>' : '') + '</div>';
    } else if (layout === 'quote') {
      inner = eyebrow(pick(slide, 'eyebrow', 'kicker') || 'In their words')
        + '<div class="fill"><div class="quote">' + esc(pick(slide, 'quote', 'text', 'body')) + '</div>'
        + (pick(slide, 'attribution', 'author', 'who', 'attr') ? '<div class="attr">' + esc(pick(slide, 'attribution', 'author', 'who', 'attr')) + '</div>' : '') + '</div>';
    } else if (layout === 'split') {
      const L = pick(slide, 'left', 'left_column') || {}; const R = pick(slide, 'right', 'right_column') || {};
      const colHtml = (c, fb) => {
        if (typeof c === 'string') return '<p class="body-text">' + esc(c) + '</p>';
        const h = pick(c, 'heading', 'title'); const bl = arr(pick(c, 'bullets', 'points', 'items'));
        return (h ? '<h3>' + esc(h) + '</h3>' : '') + (bl.length ? '<ul class="bul">' + bl.map(b => '<li><span class="ck">&#10003;</span><span>' + esc(typeof b === 'string' ? b : pick(b, 'text', 'label')) + '</span></li>').join('') + '</ul>' : (pick(c, 'body', 'text') ? '<p class="body-text">' + esc(pick(c, 'body', 'text')) + '</p>' : fb));
      };
      inner = eyebrow(pick(slide, 'eyebrow', 'kicker'))
        + '<h2>' + esc(pick(slide, 'title', 'heading') || '') + '</h2>'
        + '<div class="fill"><div class="cols"><div>' + colHtml(L, '') + '</div><div>' + colHtml(R, '') + '</div></div></div>';
    } else if (layout === 'table') {
      const cols = arr(pick(slide, 'columns', 'headers'));
      const rows = arr(pick(slide, 'rows'));
      inner = eyebrow(pick(slide, 'eyebrow', 'kicker'))
        + '<h2>' + esc(pick(slide, 'title', 'heading') || '') + '</h2>'
        + '<div class="fill"><table class="tbl">' + (cols.length ? '<thead><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead>' : '')
        + '<tbody>' + rows.map(r => '<tr>' + arr(r).map(cell => '<td>' + esc(cell) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    } else if (layout === 'footer') {
      el.classList.add('title-slide');
      inner = '<div class="fill title-slide"><h1>' + esc(pick(slide, 'title', 'heading') || 'See FreightPOP in action.') + '</h1>'
        + (pick(slide, 'subtitle', 'sub', 'body') ? '<p class="sub">' + esc(pick(slide, 'subtitle', 'sub', 'body')) + '</p>' : '')
        + '<div class="foot-cta">' + esc(pick(slide, 'cta', 'cta_text') || 'Book a custom demo today') + ' &#8594;</div></div>';
    } else { // content / fallback
      inner = eyebrow(pick(slide, 'eyebrow', 'kicker'))
        + '<h2>' + esc(pick(slide, 'title', 'heading') || '') + '</h2>'
        + '<div class="fill"><p class="body-text">' + esc(pick(slide, 'body', 'content', 'text', 'sub') || '') + '</p></div>';
    }
    el.innerHTML = inner + logo + pagenum;
  }

  const s = document.createElement('script');
  s.src = encodeURIComponent(slug) + '/deck-data.js';
  s.onload = () => { try { render(window.FP_GEN_DECK || {}); } catch (e) { document.getElementById('err').textContent = 'Render error: ' + e.message; } };
  s.onerror = () => { document.getElementById('err').textContent = 'Deck not found: ' + slug; };
  document.head.appendChild(s);
</script>
</body>
</html>
