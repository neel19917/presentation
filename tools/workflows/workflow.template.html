<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{META_TITLE}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #051729;
      font-family: 'Montserrat', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; color: #fff;
    }
    .app {
      position: relative; z-index: 1;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ── Topbar ───────────────────────────────────────────────── */
    .topbar {
      height: 46px; flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(5,23,41,.97);
      backdrop-filter: blur(12px);
    }
    .tb-logo { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .tb-div  { width: 1px; height: 16px; background: rgba(255,255,255,.1); flex-shrink: 0; }
    .tb-eye  { font-size: 7.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent, #4088cf); font-family: Arial, sans-serif; }
    .tb-name { font-size: 12px; font-weight: 700; color: #fff; font-family: Arial, 'Arial Bold', sans-serif; letter-spacing: -0.02em; }

    /* Mode toggle */
    /* Client logo */
    .tb-client-logo          { width: auto; object-fit: contain; flex-shrink: 0; opacity: .92; }
    .tb-client-logo--sm      { height: 22px; max-width: 120px; }
    .tb-client-logo--lg      { height: 40px; max-width: 200px; }

    .mode-wrap { margin-left: auto; display: flex; align-items: center; gap: 5px; }
    .mode-label { font-size: 9px; font-weight: 700; color: rgba(255,255,255,.3); text-transform: uppercase; letter-spacing: 1px; margin-right: 2px; }
    .mode-btn {
      padding: 4px 10px; border-radius: 20px;
      font-size: 9.5px; font-weight: 700; cursor: pointer;
      border: 1px solid rgba(255,255,255,.1);
      background: transparent; color: rgba(255,255,255,.35);
      font-family: inherit; transition: all .2s ease;
      display: flex; align-items: center; gap: 4px;
    }
    .mode-btn svg { display: block; flex-shrink: 0; }
    .mode-btn.active {
      background: var(--accent, #4088cf);
      border-color: var(--accent, #4088cf);
      color: #fff;
      box-shadow: 0 0 12px rgba(var(--accent-rgb,64,136,207),.45);
    }

    /* ── Layer toggles ──────────────────────────────────────────── */
    .layer-sep-h { width: 1px; height: 16px; background: rgba(255,255,255,.08); flex-shrink: 0; margin: 0 4px; }
    .layer-lbl   { font-size: 8px; font-weight: 700; color: rgba(255,255,255,.2); text-transform: uppercase; letter-spacing: 1px; margin-right: 1px; font-family: Arial, sans-serif; }
    .lbtn {
      padding: 3px 9px; border-radius: 20px;
      font-size: 8.5px; font-weight: 700; cursor: pointer;
      border: 1px solid rgba(255,255,255,.1);
      background: transparent; color: rgba(255,255,255,.28);
      font-family: inherit; transition: all .2s ease;
      display: flex; align-items: center; gap: 3px;
    }
    .lbtn svg { display: block; flex-shrink: 0; }
    .lbtn--data.on { background: rgba(99,179,237,.15);  border-color: rgba(99,179,237,.5);  color: #63b3ed; box-shadow: 0 0 10px rgba(99,179,237,.25); }
    .lbtn--proc.on { background: rgba(167,139,250,.15); border-color: rgba(167,139,250,.5); color: #a78bfa; box-shadow: 0 0 10px rgba(167,139,250,.25); }
    .lbtn--sys.on  { background: rgba(52,211,153,.12);  border-color: rgba(52,211,153,.45);  color: #34d399; box-shadow: 0 0 10px rgba(52,211,153,.22); }

    /* ── Connector passthrough label ────────────────────────────── */
    .pconn__label {
      position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
      font-size: 7px; font-weight: 700; white-space: nowrap;
      color: #63b3ed; letter-spacing: .4px;
      background: rgba(5,23,41,.95); padding: 1px 7px; border-radius: 20px;
      border: 1px solid rgba(99,179,237,.22);
      opacity: 0; transition: opacity .35s ease;
      pointer-events: none; max-width: 90px; overflow: hidden; text-overflow: ellipsis;
    }
    .layers-data .pconn__label.has-label { opacity: 1; }

    /* ── Two-column layout when layer panel is active ───────────── */
    .card__body.has-layers {
      flex-direction: row !important;
      gap: 0 !important;
      overflow: hidden;
    }
    .card__main {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 7px;
      overflow-y: auto; overflow-x: hidden;
      padding-right: 14px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.1) transparent;
    }
    .card__main::-webkit-scrollbar { width: 3px; }
    .card__main::-webkit-scrollbar-track { background: transparent; }
    .card__main::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }

    .card__layer-panel {
      width: 196px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 0;
      overflow-y: auto; overflow-x: hidden;
      border-left: 1px solid rgba(255,255,255,.07);
      padding-left: 13px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.1) transparent;
    }
    .card__layer-panel::-webkit-scrollbar { width: 3px; }
    .card__layer-panel::-webkit-scrollbar-track { background: transparent; }
    .card__layer-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }

    /* ── Layer panel blocks ──────────────────────────────────────── */
    .lpanel-block {
      display: flex; flex-direction: column; gap: 7px;
      padding: 10px 0;
      opacity: 0; transform: translateX(14px);
      animation: lpanelBlockIn .38s cubic-bezier(.34,1,.64,1) forwards;
    }
    @keyframes lpanelBlockIn {
      from { opacity: 0; transform: translateX(14px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .lpanel-block + .lpanel-block { border-top: 1px solid rgba(255,255,255,.05); }

    .lpanel-title {
      font-size: 7px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
      display: flex; align-items: center; gap: 6px; font-family: Arial, sans-serif;
    }
    .lpanel-title__dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

    /* Data flow */
    .lpanel-flow { display: flex; flex-direction: column; gap: 5px; }
    .lpanel-flow-row { display: flex; align-items: flex-start; gap: 6px; }
    .lpanel-flow-dir {
      font-size: 7px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px;
      flex-shrink: 0; width: 22px; padding-top: 3px; font-family: Arial, sans-serif;
    }
    .lpanel-flow-dir--in  { color: #63b3ed; }
    .lpanel-flow-dir--out { color: #f6ad55; }
    .lpanel-flow-arrow { font-size: 9px; color: rgba(255,255,255,.16); padding-left: 26px; line-height: 1; }
    .lpanel-pills { display: flex; flex-wrap: wrap; gap: 3px; }
    .lpanel-pill {
      font-size: 7px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
      font-family: Arial, sans-serif;
      opacity: 0; transform: scale(.82);
      animation: lpillIn .3s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes lpillIn { to { opacity: 1; transform: scale(1); } }
    .lpanel-pill--in  { background: rgba(99,179,237,.12);  border: 1px solid rgba(99,179,237,.3);  color: #63b3ed; }
    .lpanel-pill--out { background: rgba(246,173,85,.10);  border: 1px solid rgba(246,173,85,.28); color: #f6ad55; }

    /* Processing */
    .lpanel-proc-list { display: flex; flex-direction: column; gap: 5px; }
    .lpanel-proc-item {
      display: flex; align-items: flex-start; gap: 6px;
      font-size: 8.5px; color: rgba(255,255,255,.58); line-height: 1.35;
      font-family: 'Montserrat', sans-serif;
      opacity: 0; transform: translateX(8px);
      animation: lprocIn .28s ease forwards;
    }
    @keyframes lprocIn { to { opacity: 1; transform: translateX(0); } }
    .lpanel-proc-icon { color: #a78bfa; font-size: 9px; flex-shrink: 0; line-height: 1.3; }

    /* Systems */
    .lpanel-sys-grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .lpanel-sys-chip {
      font-size: 7px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
      background: rgba(52,211,153,.07); border: 1px solid rgba(52,211,153,.22); color: #34d399;
      font-family: Arial, sans-serif;
      opacity: 0; transform: scale(.84);
      animation: lchipIn .28s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes lchipIn { to { opacity: 1; transform: scale(1); } }

    /* ── Body ─────────────────────────────────────────────────── */
    .body {
      flex: 1; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
      padding: 10px 13px 6px; gap: 8px;
    }

    /* ── Phase Navigator ──────────────────────────────────────── */
    .phase-nav {
      flex-shrink: 0; display: flex; align-items: flex-start; padding: 0 2px;
    }
    .pnode {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; cursor: pointer; flex-shrink: 0; position: relative;
    }
    .pnode__ring {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,.1);
      background: rgba(5,23,41,.85);
      font-size: 11px; font-weight: 800; color: rgba(255,255,255,.25);
      transition: all .35s cubic-bezier(.34,1.56,.64,1);
      position: relative; z-index: 1;
    }
    /* Glow ring behind active node */
    .pnode__ring::before {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: var(--ph-color, #4088cf);
      opacity: 0; filter: blur(8px);
      transition: opacity .35s ease;
      z-index: -1;
    }
    .pnode.active .pnode__ring {
      background: var(--ph-color, #4088cf);
      border-color: var(--ph-color, #4088cf);
      color: #fff;
      transform: scale(1.1);
      box-shadow: 0 0 0 3px rgba(255,255,255,.08), 0 0 18px var(--ph-color, #4088cf);
    }
    .pnode.active .pnode__ring::before { opacity: .4; }
    .pnode.done .pnode__ring {
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.2);
      color: rgba(255,255,255,.5);
    }
    .pnode__lbl {
      font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
      color: rgba(255,255,255,.2); text-align: center; white-space: nowrap;
      transition: color .3s ease; max-width: 60px;
      font-family: Arial, sans-serif;
    }
    .pnode.active .pnode__lbl { color: rgba(255,255,255,.85); }
    .pnode.done  .pnode__lbl { color: rgba(255,255,255,.35); }

    /* Connector */
    .pconn {
      flex: 1; margin: 15px 4px 0; position: relative; height: 2px;
      background: rgba(255,255,255,.07); overflow: visible;
    }
    .pconn__track {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.06);
    }
    .pconn__fill {
      position: absolute; left: 0; top: 0; width: 0; height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,.2), var(--ph-color-next, #4088cf));
      transition: width .6s cubic-bezier(.4,0,.2,1);
    }
    /* Traveling dot on connector in autoplay */
    .pconn__dot {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 5px; height: 5px; border-radius: 50%;
      background: #fff; left: -10px;
      opacity: 0;
      box-shadow: 0 0 6px #fff;
      transition: none;
    }
    .pconn.traveling .pconn__dot {
      opacity: 1;
      transition: left 4.5s linear, opacity .1s ease;
    }
    /* Arrow chevron at right end of connector */
    .pconn__arrow {
      position: absolute; right: -7px; top: 50%;
      transform: translateY(-50%);
      width: 0; height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 7px solid rgba(255,255,255,.22);
      transition: border-left-color .4s ease;
    }
    .pconn.done .pconn__arrow { border-left-color: var(--ph-color-next, #4088cf); }
    .pconn.traveling .pconn__arrow { border-left-color: rgba(255,255,255,.5); }

    /* ── Card ─────────────────────────────────────────────────── */
    .card {
      flex: 1; min-height: 0;
      border-radius: 16px; padding: 14px 16px 48px;
      overflow: hidden; position: relative;
      display: flex; flex-direction: column; gap: 9px;
      opacity: 0; transform: translateY(8px) scale(.99);
      transition: opacity .3s ease, transform .3s ease;
      /* Dynamic border glow via box-shadow */
      box-shadow: 0 0 0 1px rgba(255,255,255,.07),
                  inset 0 1px 0 rgba(255,255,255,.06);
      background: rgba(255,255,255,.025);
    }
    .card.visible { opacity: 1; transform: translateY(0) scale(1); }

    /* Slide direction helpers */
    .card.exit-left  { opacity: 0; transform: translateX(-18px) scale(.98); }
    .card.exit-right { opacity: 0; transform: translateX(18px)  scale(.98); }
    .card.enter-left { animation: slideInLeft  .3s cubic-bezier(.34,.8,.64,1) forwards; }
    .card.enter-right{ animation: slideInRight .3s cubic-bezier(.34,.8,.64,1) forwards; }
    @keyframes slideInLeft  { from{opacity:0;transform:translateX(18px) scale(.98)}  to{opacity:1;transform:translateX(0) scale(1)} }
    @keyframes slideInRight { from{opacity:0;transform:translateX(-18px) scale(.98)} to{opacity:1;transform:translateX(0) scale(1)} }

    /* Phase-colored top border */
    .card__accent {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--ph-color, #4088cf), transparent);
      opacity: .8;
    }

    /* Blueprint grid */
    .card__grid {
      position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 20px 20px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, black 30%, transparent 80%);
    }

    /* Corner glow */
    .card__glow {
      position: absolute; top: -30%; right: -10%; width: 50%; height: 70%;
      border-radius: 50%; pointer-events: none; z-index: 0;
      background: radial-gradient(circle, var(--ph-color, #4088cf) 0%, transparent 70%);
      opacity: .06; filter: blur(20px);
      transition: background .5s ease;
    }

    .card__header {
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0; position: relative; z-index: 2;
    }
    .card__icon {
      width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center;
      color: var(--ph-color, #4088cf);
      transition: all .4s ease;
      box-shadow: 0 0 0 0 var(--ph-color, #4088cf);
    }
    .card.visible .card__icon {
      box-shadow: 0 0 16px rgba(var(--accent-rgb,64,136,207),.2);
      border-color: rgba(var(--accent-rgb,64,136,207),.35);
    }
    @keyframes iconPulse {
      0%,100%{box-shadow:0 0 10px rgba(var(--accent-rgb,64,136,207),.2)}
      50%    {box-shadow:0 0 22px rgba(var(--accent-rgb,64,136,207),.5)}
    }
    .card.visible .card__icon { animation: iconPulse 3s ease-in-out infinite; }

    .card__meta { flex: 1; }
    .card__step {
      font-size: 8px; font-weight: 400; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--ph-color, #4088cf); opacity: .85; margin-bottom: 2px;
      font-family: Arial, sans-serif; line-height: 1.12;
    }
    .card__title {
      font-size: 15px; font-weight: 700; color: #fff; line-height: 0.95;
      font-family: Arial, 'Arial Bold', sans-serif; letter-spacing: -0.04em;
    }

    .card__badge {
      flex-shrink: 0; font-size: 9px; font-weight: 700; padding: 3px 9px;
      border-radius: 20px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15);
      color: rgba(255,255,255,.6);
      display: flex; align-items: center; gap: 4px;
    }
    .card__badge::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: #fbbf24; flex-shrink: 0;
      box-shadow: 0 0 6px #fbbf24;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .card__rule {
      height: 1px; flex-shrink: 0; position: relative; z-index: 2;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    }

    .card__body {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column; gap: 7px;
      position: relative; z-index: 2;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.1) transparent;
    }
    .card__body::-webkit-scrollbar { width: 3px; }
    .card__body::-webkit-scrollbar-track { background: transparent; }
    .card__body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }
    .card__desc {
      font-size: 11px; font-weight: 400;
      color: rgba(255,255,255,.6); line-height: 1.4; flex-shrink: 0;
      font-family: 'Montserrat', sans-serif;
    }

    /* Branch tabs */
    .btabs { display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; }
    .btab {
      padding: 5px 11px; border-radius: 20px; font-size: 9.5px; font-weight: 700;
      cursor: pointer; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); color: rgba(255,255,255,.38);
      transition: all .2s ease; font-family: inherit;
      display: flex; align-items: center; gap: 5px;
    }
    .btab::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; opacity: .5; flex-shrink: 0;
      transition: opacity .2s ease;
    }
    .btab.on {
      background: rgba(var(--accent-rgb,64,136,207),.18);
      border-color: rgba(var(--accent-rgb,64,136,207),.5);
      color: var(--ph-color, #4088cf);
    }
    .btab.on::before { opacity: 1; background: var(--ph-color, #4088cf); box-shadow: 0 0 6px var(--ph-color, #4088cf); }

    /* Steps */
    .steps { display: flex; flex-direction: column; gap: 5px; flex: 1; min-height: 0; }
    .step {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 11px 7px 10px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      border-left: 2px solid var(--ph-color, #4088cf);
      border-radius: 8px; flex-shrink: 0;
      opacity: 0; transform: translateX(-10px);
      transition: opacity .3s ease, transform .3s ease, background .18s ease;
    }
    .step.in { opacity: 1; transform: translateX(0); }
    .step:hover { background: rgba(255,255,255,.055); }

    /* Autoplay step spotlight */
    .steps.running .step:not(.spotlight) {
      opacity: 0.28;
      transition: opacity .45s ease, transform .3s ease, background .18s ease;
    }
    .step.spotlight {
      background: rgba(var(--accent-rgb,64,136,207),.11);
      border-left-color: var(--ph-color, #4088cf);
      border-left-width: 3px;
      box-shadow: 0 0 0 1px rgba(var(--accent-rgb,64,136,207),.22),
                  0 0 16px rgba(var(--accent-rgb,64,136,207),.08);
      transition: opacity .45s ease, transform .3s ease, background .28s ease, box-shadow .28s ease;
    }
    .step.spotlight .step__txt { color: #fff; }
    .step.spotlight .step__num {
      background: rgba(var(--accent-rgb,64,136,207),.28);
      border-color: rgba(var(--accent-rgb,64,136,207),.65);
    }

    /* Solo step — keep fully visible + pulse glow to draw attention */
    @keyframes soloGlow {
      0%,100% { box-shadow: 0 0 0 1px rgba(var(--accent-rgb,64,136,207),.22),
                            0 0 14px rgba(var(--accent-rgb,64,136,207),.08); }
      50%     { box-shadow: 0 0 0 1px rgba(var(--accent-rgb,64,136,207),.55),
                            0 0 30px rgba(var(--accent-rgb,64,136,207),.28); }
    }
    .step.spotlight-solo {
      animation: soloGlow 2s ease-in-out infinite;
      opacity: 1 !important;
    }
    .step__num {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      background: rgba(var(--accent-rgb,64,136,207),.15);
      border: 1px solid rgba(var(--accent-rgb,64,136,207),.3);
      font-size: 8px; font-weight: 900; color: var(--ph-color, #4088cf);
      display: flex; align-items: center; justify-content: center;
    }
    .step__txt { font-size: 11px; font-weight: 400; color: rgba(255,255,255,.82); line-height: 1.4; font-family: 'Montserrat', sans-serif; }

    /* ── Decision: branch carousel (autoplay) ────────────────── */
    .branch-view {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      gap: 8px; position: relative; overflow-y: auto; overflow-x: hidden;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.1) transparent;
    }
    .branch-view::-webkit-scrollbar { width: 3px; }
    .branch-view::-webkit-scrollbar-track { background: transparent; }
    .branch-view::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }

    /* Branch tab bar */
    .branch-tabs {
      display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; padding-bottom: 2px;
    }
    .branch-tab {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 13px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.4); font-size: 10px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .8px;
      cursor: pointer; font-family: inherit;
      transition: background .2s, border-color .2s, color .2s, box-shadow .2s;
      user-select: none;
    }
    .branch-tab:hover {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.28);
      color: rgba(255,255,255,.78);
    }
    .branch-tab.on {
      background: rgba(var(--bt-rgb, 64,136,207), .14);
      border-color: var(--bt-color, #4088cf);
      color: var(--bt-color, #4088cf);
      box-shadow: 0 0 14px -3px var(--bt-color, #4088cf);
    }
    .branch-tab__dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .branch-tab.on .branch-tab__dot {
      box-shadow: 0 0 5px var(--bt-color, #4088cf);
    }

    /* Slide-in / slide-out for branch content */
    @keyframes branchIn  {
      from { transform:translateX(18px) scale(.97) }
      65%  { transform:translateX(-2px) scale(1.003) }
      to   { transform:translateX(0) scale(1) }
    }
    @keyframes branchOut {
      to  { opacity:0; transform:translateX(-16px) scale(.97) }
    }
    .branch-content {
      flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 7px;
    }
    .branch-content.is-entering {
      animation: branchIn .33s cubic-bezier(.34,1,.64,1) forwards;
    }
    .branch-content.is-exiting {
      animation: branchOut .18s ease forwards;
    }

    /* Individual steps inside carousel */
    .bstep {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 11px 7px 10px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      border-left: 2px solid var(--bb-color, #4088cf);
      border-radius: 8px; flex-shrink: 0;
      opacity: 0; transform: translateY(10px) scale(.94);
      transition: opacity .3s ease, transform .38s cubic-bezier(.34,1.56,.64,1),
                  background .18s ease;
    }
    .bstep.in { opacity: 1; transform: translateY(0) scale(1); }

    /* Branch step spotlight (autoplay decision phases) */
    .branch-content.running .bstep:not(.spotlight) {
      opacity: 0.28;
      transition: opacity .45s ease, transform .38s cubic-bezier(.34,1.56,.64,1), background .18s ease;
    }
    .bstep.spotlight {
      background: rgba(var(--bb-rgb,64,136,207),.11);
      border-left-color: var(--bb-color, #4088cf);
      border-left-width: 3px;
      box-shadow: 0 0 0 1px rgba(var(--bb-rgb,64,136,207),.22),
                  0 0 16px rgba(var(--bb-rgb,64,136,207),.08);
      transition: opacity .45s ease, transform .38s cubic-bezier(.34,1.56,.64,1),
                  background .28s ease, box-shadow .28s ease;
    }
    .bstep.spotlight .bstep__txt { color: #fff; }
    .bstep.spotlight .bstep__n {
      background: rgba(var(--bb-rgb,64,136,207),.28);
      border-color: rgba(var(--bb-rgb,64,136,207),.65);
    }
    @keyframes bstepSoloGlow {
      0%,100% { box-shadow: 0 0 0 1px rgba(var(--bb-rgb,64,136,207),.22), 0 0 14px rgba(var(--bb-rgb,64,136,207),.08); }
      50%     { box-shadow: 0 0 0 1px rgba(var(--bb-rgb,64,136,207),.55), 0 0 30px rgba(var(--bb-rgb,64,136,207),.28); }
    }
    .bstep.spotlight-solo { animation: bstepSoloGlow 2s ease-in-out infinite; opacity: 1 !important; }

    .bstep__n {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      background: rgba(var(--bb-rgb,64,136,207),.12);
      border: 1px solid rgba(var(--bb-rgb,64,136,207),.25);
      font-size: 8px; font-weight: 900; color: var(--bb-color, #4088cf);
      display: flex; align-items: center; justify-content: center;
    }
    .bstep__txt {
      font-size: 11px; font-weight: 400;
      color: rgba(255,255,255,.82); line-height: 1.4;
      font-family: 'Montserrat', sans-serif;
    }

    /* ── Annotation notes ────────────────────────────────────── */
    .phase-notes { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .phase-note {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 11px;
      background: rgba(245,158,11,.07);
      border: 1px solid rgba(245,158,11,.16);
      border-left: 2px solid #f59e0b;
      border-radius: 7px; flex-shrink: 0;
      opacity: 0; transform: translateY(6px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .phase-note.in { opacity: 1; transform: translateY(0); }
    .phase-note__pin { font-size: 11px; flex-shrink: 0; line-height: 1.5; }
    .phase-note__txt {
      font-size: 10px; font-weight: 400; line-height: 1.5;
      color: rgba(255,255,255,.62); font-family: 'Montserrat', sans-serif;
    }
    .phase-note__txt strong { color: #f59e0b; font-weight: 700; }

    /* ── Autoplay progress bar (bottom of card) ───────────────── */
    .prog-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 3px; z-index: 10;
      background: rgba(255,255,255,.06); border-radius: 0 0 16px 16px;
      overflow: hidden;
    }
    .prog-bar__fill {
      height: 100%; width: 0;
      background: linear-gradient(90deg, var(--ph-color, #4088cf), rgba(255,255,255,.8));
      box-shadow: 0 0 8px var(--ph-color, #4088cf);
      transition: width linear;
    }

    /* ── Bottom nav ───────────────────────────────────────────── */
    .nav-row {
      flex-shrink: 0; height: 26px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nbtn {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 11px; border-radius: 20px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.5); font-size: 10px; font-weight: 700;
      cursor: pointer; transition: all .18s ease; font-family: inherit;
    }
    .nbtn:hover:not(:disabled) { background: rgba(255,255,255,.1); color: #fff; }
    .nbtn:disabled { opacity: .2; cursor: default; }
    .nbtn svg { display: block; }
    .n-prog { font-size: 10px; font-weight: 700; color: rgba(255,255,255,.25); }

    /* ── Footer ───────────────────────────────────────────────── */
    .footer {
      height: 30px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      border-top: 1px solid rgba(255,255,255,.06);
      background: rgba(3,8,16,.95);
      font-size: 10px; color: rgba(255,255,255,.3);
    }
    .fsep { width: 1px; height: 10px; background: rgba(255,255,255,.1); }
    .footer a { color: rgba(255,255,255,.4); text-decoration: none; }

    /* ── Canvas particle layer ────────────────────────────────── */
    #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── Background orbs ──────────────────────────────────────── */
    @keyframes drift1 { 0%{transform:translate(0,0) scale(1)}   100%{transform:translate(5%,6%) scale(1.1)} }
    @keyframes drift2 { 0%{transform:translate(0,0) scale(1.05)} 100%{transform:translate(-4%,-5%) scale(.95)} }
    @keyframes drift3 { 0%{transform:translate(0,0)} 100%{transform:translate(3%,-4%)} }
    @keyframes gridMove { to{background-position:30px 30px} }
  </style>
</head>

    <span>{{META_PHONE}}</span><div class="fsep"></div>
    <span>{{META_EMAIL}}</span><div class="fsep"></div>
    <a href="{{META_WEBSITE_HREF}}" target="_blank">{{META_WEBSITE_TEXT}}</a>
  </div>
</div>

<script>
/* ── Phase data ────────────────────────────────────────────── */
var PHASES = {{PHASES_JSON}};

var ICONS = {{ICONS_JS}};

var PHASE_DUR = {{PHASE_DUR}};

/* ── State ─────────────────────────────────────────────────── */
var cur = 0, branch = 0, mode = 'auto', busy = false;
var autoTimer = null, autoStart = null, autoDur = PHASE_DUR;
var progRaf = null;
var decisionTimer = null, spotlit = 0;
var stepSpotTimer = null, stepSpotIdx = 0;
var bstepSpotTimer = null, bstepSpotIdx = 0;
var manualStep = -1; // step index for keyboard step-through in manual mode
var fitTimer = null;
var layers = { data: false, proc: false, sys: false };

/* ── Particles canvas ──────────────────────────────────────── */
(function(){
  var c = document.getElementById('particles');
  var ctx = c.getContext('2d');
  var pts = [];
  function resize(){ c.width = window.innerWidth; c.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for(var i=0;i<55;i++) pts.push({
    x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
    r:Math.random()*1.4+.4, vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18,
    o:Math.random()*.35+.05, hue:Math.random()*60+190
  });
  function frame(){
    requestAnimationFrame(frame);
    ctx.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=c.width; if(p.x>c.width)p.x=0;
      if(p.y<0)p.y=c.height; if(p.y>c.height)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='hsla('+p.hue+',80%,70%,'+p.o+')';
      ctx.fill();
    });
  }
  frame();
})();

/* ── CSS variable helpers ──────────────────────────────────── */
function applyPhaseColor(p) {
  var r = document.documentElement;
  r.style.setProperty('--ph-color', p.color);
  r.style.setProperty('--accent', p.color);
  r.style.setProperty('--accent-rgb', p.rgb);
  // Next phase color for connector gradient
  var next = PHASES[cur+1] || p;
  r.style.setProperty('--ph-color-next', next.color);
  // Orbs
  document.getElementById('orb1').style.background = 'radial-gradient(circle,rgba('+p.rgb+',.22) 0%,transparent 70%)';
  document.getElementById('orb2').style.background = 'radial-gradient(circle,rgba('+p.rgb+',.14) 0%,transparent 70%)';
  document.getElementById('orb3').style.background = 'radial-gradient(circle,rgba('+p.rgb+',.08) 0%,transparent 70%)';
  // Topbar eyebrow
  document.getElementById('tbEye').style.color = p.color;
}

/* ── Render nav ────────────────────────────────────────────── */
function renderNav() {
  var nav = document.getElementById('phaseNav');
  nav.innerHTML = '';
  PHASES.forEach(function(p, i) {
    if (i > 0) {
      var conn = document.createElement('div');
      conn.className = 'pconn'; conn.id = 'conn'+i;
      var prevPassthrough = (PHASES[i-1] && PHASES[i-1].passthrough) ? PHASES[i-1].passthrough : '';
      conn.innerHTML = '<div class="pconn__track"></div><div class="pconn__fill" id="connfill'+i+'"></div><div class="pconn__dot" id="conndot'+i+'"></div><div class="pconn__arrow"></div><div class="pconn__label' + (prevPassthrough ? ' has-label' : '') + '" id="connlabel'+i+'">' + prevPassthrough + '</div>';
      nav.appendChild(conn);
    }
    var node = document.createElement('div');
    node.className = 'pnode' + (i===cur?' active':i<cur?' done':'');
    node.setAttribute('data-i', i);
    node.style.setProperty('--ph-color', p.color);
    node.onclick = function(){ userNav(parseInt(this.getAttribute('data-i'))-cur); };
    node.innerHTML = '<div class="pnode__ring">'+(i<cur?ICONS.check:(i+1))+'</div><div class="pnode__lbl">'+p.label+'</div>';
    nav.appendChild(node);
  });
  setTimeout(function(){
    for(var i=1;i<=cur;i++){
      var f=document.getElementById('connfill'+i); if(f) f.style.width='100%';
    }
  }, 20);
}

/* ── Render card ───────────────────────────────────────────── */
function renderCard() {
  var p = PHASES[cur];
  applyPhaseColor(p);

  document.getElementById('cardIcon').innerHTML = ICONS[p.icon];
  document.getElementById('cardStep').textContent = p.step;
  document.getElementById('cardTitle').textContent = p.title;

  var badge = document.getElementById('cardBadge');
  if (p.badge) { badge.textContent = p.badge; badge.style.display = ''; }
  else          { badge.style.display = 'none'; }

  var body = document.getElementById('cardBody');
  body.innerHTML = '';

  var desc = document.createElement('div');
  desc.className = 'card__desc'; desc.textContent = p.desc;
  body.appendChild(desc);

  if (p.branches && mode === 'auto') {
    /* ── Autoplay: carousel — one branch at a time ── */
    /* Carousel is kicked off by startAutoplay() once autoDur is set */
    var view = document.createElement('div');
    view.id = 'branchView'; view.className = 'branch-view';
    body.appendChild(view);

  } else if (p.branches && mode === 'manual') {
    /* ── Manual: tabs to pick one branch ── */
    var tabs = document.createElement('div'); tabs.className = 'btabs';
    p.branches.forEach(function(b, i) {
      var btn = document.createElement('button');
      btn.className = 'btab' + (i===branch?' on':'');
      btn.textContent = b.label; btn.setAttribute('data-b', i);
      btn.style.setProperty('--accent-rgb', b.rgb);
      btn.style.setProperty('--ph-color', b.color);
      btn.onclick = function(e) {
        e.stopPropagation();
        branch = parseInt(this.getAttribute('data-b'));
        renderCard();
      };
      tabs.appendChild(btn);
    });
    body.appendChild(tabs);
    var activeBranch = p.branches[branch];
    appendSteps(body, activeBranch.steps, activeBranch.color, activeBranch.rgb);
    appendNotes(body, activeBranch.notes, activeBranch.steps.length * 90);
    appendNotes(body, p.notes, activeBranch.steps.length * 90 + 80);

  } else {
    appendSteps(body, p.steps, p.color, p.rgb);
    appendNotes(body, p.notes, p.steps.length * 90);
  }

  renderLayers(body, p);

  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur === PHASES.length - 1;
  document.getElementById('navProg').textContent = (cur+1)+' / '+PHASES.length;
  document.getElementById('progBar').style.display = mode==='auto' ? '' : 'none';
}

function appendSteps(parent, steps, color, rgb) {
  var list = document.createElement('div'); list.className = 'steps';
  steps.forEach(function(txt, i) {
    var s = document.createElement('div'); s.className = 'step';
    s.style.borderLeftColor = color;
    s.style.setProperty('--ph-color', color);
    s.style.setProperty('--accent-rgb', rgb);
    s.innerHTML = '<div class="step__num">'+(i+1)+'</div><div class="step__txt">'+txt+'</div>';
    list.appendChild(s);
    setTimeout(function(){ s.classList.add('in'); }, 80 + i*90);
  });
  parent.appendChild(list);
  setTimeout(fitCardContent, 50);
}

/* ── Annotation notes ───────────────────────────────────────── */
function appendNotes(parent, notes, startDelay) {
  if (!notes || !notes.length) return;
  var delay = startDelay || 0;
  var container = document.createElement('div');
  container.className = 'phase-notes';
  notes.forEach(function(txt, i) {
    var n = document.createElement('div');
    n.className = 'phase-note';
    n.innerHTML = '<span class="phase-note__pin">📌</span><span class="phase-note__txt">' + txt + '</span>';
    container.appendChild(n);
    setTimeout(function() { n.classList.add('in'); }, delay + 60 + i * 80);
  });
  parent.appendChild(container);
}

/* ── Decision branch carousel ──────────────────────────────── */
function startDecisionCycle(numBranches) {
  stopDecisionCycle();
  spotlit = 0;
  showBranch(spotlit, numBranches, true);
  var interval = Math.floor(autoDur / numBranches);
  decisionTimer = setInterval(function() {
    spotlit = (spotlit + 1) % numBranches;
    showBranch(spotlit, numBranches, false);
  }, interval);
}

function stopDecisionCycle() {
  clearInterval(decisionTimer); decisionTimer = null;
  stopBstepSpotlight();
}

function showBranch(idx, total, isFirst) {
  var p = PHASES[cur]; if (!p.branches) return;
  var view = document.getElementById('branchView'); if (!view) return;
  var branchMs = Math.floor(autoDur / total);
  stopBstepSpotlight();
  var old = view.querySelector('.branch-content');
  if (old && !isFirst) {
    old.classList.remove('is-entering');
    old.classList.add('is-exiting');
    setTimeout(function() {
      renderBranchContent(view, p, idx, total);
      setTimeout(function() { if (mode !== 'manual') startBstepSpotlight(branchMs); }, 400);
    }, 190);
  } else {
    renderBranchContent(view, p, idx, total);
    if (isFirst) setTimeout(fitCardContent, 200);
    setTimeout(function() { if (mode !== 'manual') startBstepSpotlight(branchMs); }, 400);
  }
}

function renderBranchContent(view, p, idx, total) {
  view.innerHTML = '';
  var b = p.branches[idx];

  /* Clickable tab bar */
  var tabs = document.createElement('div'); tabs.className = 'branch-tabs';
  for (var d = 0; d < total; d++) {
    var tb = p.branches[d];
    var tabEl = document.createElement('button');
    tabEl.className = 'branch-tab' + (d === idx ? ' on' : '');
    tabEl.style.setProperty('--bt-color', tb.color);
    tabEl.style.setProperty('--bt-rgb', tb.rgb);
    tabEl.innerHTML = '<span class="branch-tab__dot" style="background:' + tb.color + '"></span>' + tb.label;
    (function(di) {
      tabEl.onclick = function() {
        pauseToManual(); // stops autoTimer + decision cycle + spotlights
        spotlit = di;
        showBranch(di, total, false);
      };
    })(d);
    tabs.appendChild(tabEl);
  }
  view.appendChild(tabs);

  /* Animated steps */
  var content = document.createElement('div'); content.className = 'branch-content is-entering';
  b.steps.forEach(function(txt, si) {
    var s = document.createElement('div'); s.className = 'bstep';
    s.style.setProperty('--bb-color', b.color);
    s.style.setProperty('--bb-rgb', b.rgb);
    s.innerHTML = '<div class="bstep__n">' + (si + 1) + '</div><div class="bstep__txt">' + txt + '</div>';
    content.appendChild(s);
    setTimeout(function() { s.classList.add('in'); }, 80 + si * 110);
  });
  view.appendChild(content);
  // Branch-level annotation notes
  if (b.notes && b.notes.length) appendNotes(view, b.notes, 80 + b.steps.length * 110);
}

/* ── Step spotlight (autoplay linear phases) ───────────────── */
function startStepSpotlight() {
  stopStepSpotlight();
  var steps = document.querySelectorAll('#cardBody .steps .step');
  if (!steps.length) return;
  var container = steps[0].parentElement;
  container.classList.add('running');
  stepSpotIdx = 0;
  highlightStep(steps, stepSpotIdx);

  if (steps.length === 1) {
    // Solo bullet — add pulsing glow so it's clearly animated
    steps[0].classList.add('spotlight-solo');
  } else {
    var interval = Math.max(550, Math.floor((autoDur - 350) / steps.length));
    stepSpotTimer = setInterval(function() {
      stepSpotIdx = (stepSpotIdx + 1) % steps.length;
      highlightStep(steps, stepSpotIdx);
    }, interval);
  }
}

function stopStepSpotlight() {
  clearInterval(stepSpotTimer); stepSpotTimer = null;
  var container = document.querySelector('#cardBody .steps');
  if (container) {
    container.classList.remove('running');
    container.querySelectorAll('.step').forEach(function(s) {
      s.classList.remove('spotlight', 'spotlight-solo');
    });
  }
}

function highlightStep(steps, idx) {
  steps.forEach(function(s, i) { s.classList.toggle('spotlight', i === idx); });
}

/* ── Branch step spotlight (decision phases) ────────────────── */
function startBstepSpotlight(branchMs) {
  stopBstepSpotlight();
  var bsteps = document.querySelectorAll('#cardBody .branch-content .bstep');
  if (!bsteps.length) return;
  var content = bsteps[0].parentNode;
  if (!content) return;
  content.classList.add('running');
  bstepSpotIdx = 0;
  if (bsteps.length === 1) {
    bsteps[0].classList.add('spotlight-solo');
  } else {
    var interval = Math.max(500, Math.floor((branchMs - 600) / bsteps.length));
    highlightBstep(bsteps, 0);
    bstepSpotTimer = setInterval(function() {
      bstepSpotIdx = (bstepSpotIdx + 1) % bsteps.length;
      highlightBstep(bsteps, bstepSpotIdx);
    }, interval);
  }
}

function stopBstepSpotlight() {
  clearInterval(bstepSpotTimer); bstepSpotTimer = null;
  var content = document.querySelector('#cardBody .branch-content');
  if (content) {
    content.classList.remove('running');
    content.querySelectorAll('.bstep').forEach(function(s) {
      s.classList.remove('spotlight', 'spotlight-solo');
    });
  }
}

function highlightBstep(bsteps, idx) {
  bsteps.forEach(function(s, i) { s.classList.toggle('spotlight', i === idx); });
}

/* ── Dynamic content fitting ────────────────────────────────── */
function fitCardContent() {
  // Clear any previous fit styles
  document.querySelectorAll('[data-fit="1"]').forEach(function(el) {
    el.style.paddingTop = el.style.paddingBottom = '';
    el.style.fontSize = ''; el.style.lineHeight = '';
    el.style.width = el.style.height = '';
    el.removeAttribute('data-fit');
  });
  var bodyEl = document.getElementById('cardBody');
  if (!bodyEl) return;
  // In two-column mode, scale the main content column only
  var body = bodyEl.querySelector('.card__main') || bodyEl;
  body.style.gap = '';
  body.querySelectorAll('.steps, .branch-content').forEach(function(el) { el.style.gap = ''; });

  var avail = body.clientHeight;
  var used  = body.scrollHeight;
  if (!avail || !used) return;

  var scale = avail / used;
  scale = Math.min(Math.max(scale, 0.62), 2.1);
  if (scale > 0.90 && scale < 1.08) return; // content already fits well

  function applyFit(el, styles) {
    el.setAttribute('data-fit', '1');
    Object.keys(styles).forEach(function(k) { el.style[k] = styles[k]; });
  }

  // Step & branch-step row padding
  var pad = Math.max(2, Math.min(Math.round(7 * scale), 18));
  body.querySelectorAll('.step, .bstep').forEach(function(el) {
    applyFit(el, { paddingTop: pad + 'px', paddingBottom: pad + 'px' });
  });

  // Step text
  var txtSz = Math.max(8.5, Math.min(+(11 * scale).toFixed(1), 18));
  body.querySelectorAll('.step__txt, .bstep__txt').forEach(function(el) {
    applyFit(el, { fontSize: txtSz + 'px' });
  });

  // Description
  var descSz = Math.max(8.5, Math.min(+(10.5 * scale).toFixed(1), 16));
  body.querySelectorAll('.card__desc').forEach(function(el) {
    applyFit(el, { fontSize: descSz + 'px', lineHeight: '1.5' });
  });

  // Number circles
  var numSz = Math.max(11, Math.min(Math.round(16 * scale), 28));
  var numFt = Math.max(6,  Math.min(Math.round(8  * scale), 13));
  body.querySelectorAll('.step__num, .bstep__n').forEach(function(el) {
    applyFit(el, { width: numSz + 'px', height: numSz + 'px', fontSize: numFt + 'px' });
  });

  // Gaps
  body.style.gap = Math.max(3, Math.min(Math.round(7 * scale), 14)) + 'px';
  body.querySelectorAll('.steps, .branch-content').forEach(function(el) {
    el.style.gap = Math.max(2, Math.min(Math.round(5 * scale), 10)) + 'px';
  });

  // Card header: title + step label (cap scale for readability)
  var headScale = Math.min(scale, 1.45);
  var card = document.getElementById('card');
  if (card) {
    var titleEl = card.querySelector('.card__title');
    var stepEl  = card.querySelector('.card__step');
    if (titleEl) applyFit(titleEl, { fontSize: Math.max(11, Math.min(+(14 * headScale).toFixed(1), 22)) + 'px' });
    if (stepEl)  applyFit(stepEl,  { fontSize: Math.max(7,  Math.min(+(8  * headScale).toFixed(1), 12)) + 'px' });
  }
}

/* ── Transition ────────────────────────────────────────────── */
function goTo(index, dir) {
  if (index < 0 || index >= PHASES.length || busy) return;
  if (index === cur && !dir) return;
  busy = true;
  stopAutoplay();

  var card = document.getElementById('card');
  var exitClass = (dir >= 0) ? 'exit-left' : 'exit-right';
  var enterClass= (dir >= 0) ? 'enter-left' : 'enter-right';

  card.classList.remove('visible','enter-left','enter-right');
  card.classList.add(exitClass);

  setTimeout(function(){
    cur = index; branch = 0; manualStep = -1;
    renderNav(); renderCard();
    card.classList.remove('visible', exitClass, 'enter-left', 'enter-right');
    void card.offsetHeight; // force reflow so transition triggers
    card.classList.add(enterClass);
    setTimeout(function(){
      card.classList.remove(enterClass);
      card.classList.add('visible');
      busy = false;
      if (mode==='auto') startAutoplay();
    }, 320);
  }, 200);
}

/* ── Autoplay ──────────────────────────────────────────────── */
function startAutoplay() {
  if (mode !== 'auto') return;
  stopAutoplay();
  // Decision phases get proportionally more time so all branches can be seen
  autoDur = PHASES[cur].badge === 'Decision Point' ? Math.round(PHASE_DUR * 1.8) : PHASE_DUR;
  var fill = document.getElementById('progFill');
  fill.style.transition = 'none'; fill.style.width = '0';
  void fill.offsetHeight; // force reflow
  fill.style.transition = 'width '+autoDur+'ms linear';
  fill.style.width = '100%';

  // Animate connector traveling dot
  if (cur < PHASES.length - 1) {
    var dot = document.getElementById('conndot'+(cur+1));
    var conn= document.getElementById('conn'+(cur+1));
    if (dot && conn) {
      dot.style.transition = 'none'; dot.style.left = '-5px';
      void dot.offsetHeight; // force reflow
      if(conn) conn.classList.add('traveling');
      dot.style.transition = 'left '+autoDur+'ms linear';
      dot.style.left = (conn.offsetWidth+5)+'px';
    }
  }

  // Start branch carousel AFTER autoDur is set
  if (PHASES[cur].branches) {
    startDecisionCycle(PHASES[cur].branches.length);
  }
  // Start step spotlight for linear phases (wait for step stagger animation)
  if (PHASES[cur].steps) {
    setTimeout(startStepSpotlight, 380);
  }

  autoTimer = setTimeout(function(){
    var next = (cur + 1) % PHASES.length;
    goTo(next, 1);
  }, autoDur);
}

function stopAutoplay() {
  clearTimeout(autoTimer); autoTimer = null;
  if (progRaf) { cancelAnimationFrame(progRaf); progRaf = null; }
  stopDecisionCycle();
  stopStepSpotlight();
  for (var i=1;i<PHASES.length;i++){
    var c=document.getElementById('conn'+i);
    if(c) c.classList.remove('traveling');
  }
}

/* ── Mode switch ───────────────────────────────────────────── */
function setMode(m) {
  mode = m;
  document.getElementById('btnAuto').classList.toggle('active', m==='auto');
  document.getElementById('btnManual').classList.toggle('active', m==='manual');
  document.getElementById('progBar').style.display = m==='auto' ? '' : 'none';
  if (m === 'auto') {
    // Re-render decision phases to show all-branches view
    if (PHASES[cur].branches) { branch = 0; renderCard(); }
    startAutoplay();
  } else {
    stopAutoplay();
    var fill = document.getElementById('progFill');
    fill.style.transition='none'; fill.style.width='0';
    // Re-render decision phases to show tabs view
    if (PHASES[cur].branches) { branch = 0; renderCard(); }
  }
}

/* ── User navigation (resets autoplay timer) ───────────────── */
function userNav(dir) {
  goTo(cur + dir, dir >= 0 ? 1 : -1);
}

/* ── Layer toggle ──────────────────────────────────────────── */
function toggleLayer(name) {
  layers[name] = !layers[name];
  var btnMap = { data: 'btnData', proc: 'btnProc', sys: 'btnSys' };
  document.getElementById(btnMap[name]).classList.toggle('on', layers[name]);
  if (name === 'data') document.body.classList.toggle('layers-data', layers.data);
  renderCard();
}

/* ── Layer side panel rendering ────────────────────────────── */
function renderLayers(body, p) {
  var hasAny = layers.data || layers.proc || layers.sys;
  if (!hasAny) { setTimeout(fitCardContent, 60); return; }

  // Wrap current body children in .card__main
  body.classList.add('has-layers');
  var main = document.createElement('div');
  main.className = 'card__main';
  while (body.firstChild) { main.appendChild(body.firstChild); }
  body.appendChild(main);

  // Build the side panel
  var panel = document.createElement('div');
  panel.className = 'card__layer-panel';
  var d = 0;
  if (layers.data) { buildDataBlock(panel, p, d); d += 55; }
  if (layers.proc) { buildProcBlock(panel, p, d); d += 55; }
  if (layers.sys)  { buildSysBlock(panel, p, d); d += 55; }
  body.appendChild(panel);
  setTimeout(fitCardContent, d + 360);
}

function buildDataBlock(panel, p, delay) {
  if ((!p.inputs || !p.inputs.length) && (!p.outputs || !p.outputs.length)) return;
  var block = document.createElement('div');
  block.className = 'lpanel-block';
  block.style.animationDelay = delay + 'ms';

  var title = document.createElement('div'); title.className = 'lpanel-title';
  title.style.color = '#63b3ed';
  var dot = document.createElement('span'); dot.className = 'lpanel-title__dot';
  dot.style.background = '#63b3ed'; dot.style.boxShadow = '0 0 6px #63b3ed';
  title.append(dot, 'Data Flow');
  block.appendChild(title);

  var flow = document.createElement('div'); flow.className = 'lpanel-flow';

  if (p.inputs && p.inputs.length) {
    var inRow = document.createElement('div'); inRow.className = 'lpanel-flow-row';
    var inDir = document.createElement('span'); inDir.className = 'lpanel-flow-dir lpanel-flow-dir--in'; inDir.textContent = 'IN';
    var inPills = document.createElement('div'); inPills.className = 'lpanel-pills';
    p.inputs.forEach(function(txt, i) {
      var pill = document.createElement('span'); pill.className = 'lpanel-pill lpanel-pill--in'; pill.textContent = txt;
      pill.style.animationDelay = (delay + 80 + i * 50) + 'ms';
      inPills.appendChild(pill);
    });
    inRow.append(inDir, inPills); flow.appendChild(inRow);
  }
  if (p.inputs && p.inputs.length && p.outputs && p.outputs.length) {
    var arr = document.createElement('div'); arr.className = 'lpanel-flow-arrow'; arr.textContent = '↓';
    flow.appendChild(arr);
  }
  if (p.outputs && p.outputs.length) {
    var outRow = document.createElement('div'); outRow.className = 'lpanel-flow-row';
    var outDir = document.createElement('span'); outDir.className = 'lpanel-flow-dir lpanel-flow-dir--out'; outDir.textContent = 'OUT';
    var outPills = document.createElement('div'); outPills.className = 'lpanel-pills';
    p.outputs.forEach(function(txt, i) {
      var pill = document.createElement('span'); pill.className = 'lpanel-pill lpanel-pill--out'; pill.textContent = txt;
      pill.style.animationDelay = (delay + 140 + i * 50) + 'ms';
      outPills.appendChild(pill);
    });
    outRow.append(outDir, outPills); flow.appendChild(outRow);
  }
  block.appendChild(flow);
  panel.appendChild(block);
}

function buildProcBlock(panel, p, delay) {
  if (!p.processing || !p.processing.length) return;
  var block = document.createElement('div');
  block.className = 'lpanel-block';
  block.style.animationDelay = delay + 'ms';

  var title = document.createElement('div'); title.className = 'lpanel-title';
  title.style.color = '#a78bfa';
  var dot = document.createElement('span'); dot.className = 'lpanel-title__dot';
  dot.style.background = '#a78bfa'; dot.style.boxShadow = '0 0 6px #a78bfa';
  title.append(dot, 'Processing');
  block.appendChild(title);

  var list = document.createElement('div'); list.className = 'lpanel-proc-list';
  p.processing.forEach(function(txt, i) {
    var item = document.createElement('div'); item.className = 'lpanel-proc-item';
    item.style.animationDelay = (delay + 80 + i * 60) + 'ms';
    var icon = document.createElement('span'); icon.className = 'lpanel-proc-icon'; icon.textContent = '⟳';
    var span = document.createElement('span'); span.textContent = txt;
    item.append(icon, span); list.appendChild(item);
  });
  block.appendChild(list);
  panel.appendChild(block);
}

function buildSysBlock(panel, p, delay) {
  if (!p.systems || !p.systems.length) return;
  var block = document.createElement('div');
  block.className = 'lpanel-block';
  block.style.animationDelay = delay + 'ms';

  var title = document.createElement('div'); title.className = 'lpanel-title';
  title.style.color = '#34d399';
  var dot = document.createElement('span'); dot.className = 'lpanel-title__dot';
  dot.style.background = '#34d399'; dot.style.boxShadow = '0 0 6px #34d399';
  title.append(dot, 'Systems');
  block.appendChild(title);

  var grid = document.createElement('div'); grid.className = 'lpanel-sys-grid';
  p.systems.forEach(function(txt, i) {
    var chip = document.createElement('span'); chip.className = 'lpanel-sys-chip'; chip.textContent = txt;
    chip.style.animationDelay = (delay + 80 + i * 40) + 'ms';
    grid.appendChild(chip);
  });
  block.appendChild(grid);
  panel.appendChild(block);
}

/* ── Pause to manual without re-rendering the card ─────────── */
function pauseToManual() {
  if (mode === 'manual') return;
  mode = 'manual';
  document.getElementById('btnAuto').classList.remove('active');
  document.getElementById('btnManual').classList.add('active');
  document.getElementById('progBar').style.display = 'none';
  var fill = document.getElementById('progFill');
  fill.style.transition = 'none'; fill.style.width = '0';
  stopAutoplay(); // clears autoTimer, decisionTimer, stepSpotlight, bstepSpotlight
}

/* ── Keyboard step-through (auto-pauses on first keypress) ──── */
function stepNav(dir) {
  pauseToManual();

  var p = PHASES[cur];
  if (p.branches) { stepNavDecision(dir, p); return; }

  // ── Linear phase ───────────────────────────────────────────
  var steps = Array.from(document.querySelectorAll('#cardBody .steps .step'));
  if (!steps.length) { goWrap(dir); return; }

  var newIdx = manualStep + dir;

  if (newIdx >= steps.length) {
    clearManualSteplight(false, steps);
    manualStep = -1;
    goWrap(1);
  } else if (newIdx < 0 && manualStep === -1) {
    goWrap(-1);
  } else if (newIdx < 0) {
    manualStep = -1;
    clearManualSteplight(false, steps);
  } else {
    manualStep = newIdx;
    applyManualSteplight(false, steps, manualStep);
  }
}

/* ── Decision phase keyboard: each press = one step, steps exhaust → next branch → next phase ── */
function stepNavDecision(dir, p) {
  var total = p.branches.length;

  if (dir > 0) {
    // ── Forward ──
    if (manualStep === -1) {
      // First keypress — highlight step 0 of current branch
      manualStep = 0;
      var bs = Array.from(document.querySelectorAll('#cardBody .branch-content .bstep'));
      if (bs.length) applyManualSteplight(true, bs, 0);
    } else {
      var curLen = p.branches[spotlit].steps.length;
      if (manualStep < curLen - 1) {
        // Next step within same branch
        manualStep++;
        var bs = Array.from(document.querySelectorAll('#cardBody .branch-content .bstep'));
        if (bs.length) applyManualSteplight(true, bs, manualStep);
      } else if (spotlit < total - 1) {
        // Switch to next branch, step 0
        switchBranchForStep(spotlit + 1, total, 0);
      } else {
        // Past last step of last branch → next phase (wrap)
        manualStep = -1;
        goWrap(1);
      }
    }
  } else {
    // ── Backward ──
    if (manualStep === -1) {
      // No step selected → go to previous phase (wrap)
      goWrap(-1);
    } else if (manualStep > 0) {
      // Previous step within same branch
      manualStep--;
      var bs = Array.from(document.querySelectorAll('#cardBody .branch-content .bstep'));
      if (bs.length) applyManualSteplight(true, bs, manualStep);
    } else if (spotlit > 0) {
      // Back to previous branch, last step
      var prevBranch = spotlit - 1;
      var lastStep   = p.branches[prevBranch].steps.length - 1;
      switchBranchForStep(prevBranch, total, lastStep);
    } else {
      // At step 0 of first branch → deselect
      manualStep = -1;
      clearManualSteplight(true, Array.from(document.querySelectorAll('#cardBody .branch-content .bstep')));
    }
  }
}

/* Switch visible branch then apply a specific step highlight */
function switchBranchForStep(branchIdx, total, stepIdx) {
  spotlit = branchIdx;
  showBranch(branchIdx, total, false); // won't start bstep auto-cycle in manual mode
  // Apply manual highlight after exit (190ms) + enter stagger animation (~260ms)
  setTimeout(function() {
    manualStep = stepIdx;
    var bs = Array.from(document.querySelectorAll('#cardBody .branch-content .bstep'));
    if (bs.length) applyManualSteplight(true, bs, Math.min(stepIdx, bs.length - 1));
  }, 480);
}

/* Wrap-around phase navigation */
function goWrap(dir) {
  var next = ((cur + dir) % PHASES.length + PHASES.length) % PHASES.length;
  goTo(next, dir >= 0 ? 1 : -1);
}

function applyManualSteplight(isDecision, steps, idx) {
  if (isDecision) {
    var content = steps.length ? steps[0].parentNode : null;
    if (content) content.classList.add('running');
    highlightBstep(steps, idx);
  } else {
    var container = steps.length ? steps[0].parentElement : null;
    if (container) container.classList.add('running');
    highlightStep(steps, idx);
  }
}

function clearManualSteplight(isDecision, steps) {
  if (isDecision) {
    var content = steps.length ? steps[0].parentNode : null;
    if (content) {
      content.classList.remove('running');
      content.querySelectorAll('.bstep').forEach(function(s) {
        s.classList.remove('spotlight', 'spotlight-solo');
      });
    }
  } else {
    var container = steps.length ? steps[0].parentElement : null;
    if (container) {
      container.classList.remove('running');
      container.querySelectorAll('.step').forEach(function(s) {
        s.classList.remove('spotlight', 'spotlight-solo');
      });
    }
  }
}

/* ── Pause autoplay on card hover ──────────────────────────── */
document.addEventListener('DOMContentLoaded', function(){
  var card = document.getElementById('card');
  card.addEventListener('mouseenter', function(){
    if(mode==='auto'){ stopAutoplay(); }
  });
  card.addEventListener('mouseleave', function(){
    if(mode==='auto' && !busy){ startAutoplay(); }
  });
});

/* ── Keyboard ──────────────────────────────────────────────── */
document.addEventListener('keydown', function(e){
  // Arrow keys: step through individual bullets in manual mode, or jump phase in auto mode
  if(e.key==='ArrowRight'||e.key==='ArrowDown') { e.preventDefault(); stepNav(1); }
  if(e.key==='ArrowLeft' ||e.key==='ArrowUp')   { e.preventDefault(); stepNav(-1); }
  // Space: toggle play / pause
  if(e.key===' '){ setMode(mode==='auto'?'manual':'auto'); e.preventDefault(); }
});

/* ── Init ──────────────────────────────────────────────────── */
renderNav(); renderCard();
setTimeout(function(){
  document.getElementById('card').classList.add('visible');
  setTimeout(startAutoplay, 600);
}, 150);
window.addEventListener('resize', function() {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitCardContent, 200);
});
</script>
