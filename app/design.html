<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreightPOP — Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="vendor/fabric.min.js"></script>
<style>
:root {
  --navy: #051729;
  --panel: #0A2540;
  --mint: #3DD6B5;
  --line: rgba(255,255,255,0.10);
  --muted: #B5CDE0;
  --label: #7A96B0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--navy); color: #fff; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button { font-family: inherit; cursor: pointer; }
.mono {
  font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--label);
}

/* ── Top bar ─────────────────────────────────────────────── */
.topbar {
  height: 58px; flex: 0 0 58px; display: flex; align-items: center; gap: 16px;
  padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  z-index: 20;
}
.topbar .home {
  font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  text-decoration: none; white-space: nowrap; padding: 8px 10px; border-radius: 10px;
  transition: color .15s ease, background .15s ease;
}
.topbar .home:hover { color: var(--mint); background: rgba(61,214,181,.07); }
.topbar .divider { width: 1px; height: 26px; background: var(--line); flex: 0 0 1px; }
.topbar .brand {
  font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--mint); white-space: nowrap;
  display: flex; align-items: center; gap: 9px;
}
.topbar .brand::before { content: ""; width: 20px; height: 1.5px; background: var(--mint); }
#deckTitle {
  flex: 1; min-width: 120px; max-width: 460px;
  font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 16.5px; letter-spacing: -.01em;
  color: #fff; background: rgba(255,255,255,.03); border: 1px solid transparent; border-radius: 10px;
  padding: 9px 12px; transition: border-color .15s ease, background .15s ease;
}
#deckTitle:hover { border-color: var(--line); }
#deckTitle:focus { outline: none; border-color: var(--mint); background: rgba(61,214,181,.05); }
.topbar .spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 11px;
  font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
  padding: 10px 16px; border: 1px solid var(--line); background: rgba(255,255,255,.03);
  color: var(--muted); transition: all .15s ease;
}
.btn:hover { border-color: rgba(61,214,181,.5); color: #fff; }
.btn.primary { background: var(--mint); border-color: var(--mint); color: var(--navy); }
.btn.primary:hover { background: #55E0C3; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary:disabled:hover { background: var(--mint); }

/* ── Main row ────────────────────────────────────────────── */
.main { flex: 1; display: flex; min-height: 0; }

/* Left toolbar */
.tools {
  flex: 0 0 92px; background: var(--panel); border-right: 1px solid var(--line);
  overflow-y: auto; padding: 10px 8px 18px; display: flex; flex-direction: column; gap: 4px;
}
.tools::-webkit-scrollbar { width: 0; }
.tgroup {
  font-family: 'DM Mono', monospace; font-size: 9.5px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--label);
  padding: 12px 4px 6px; opacity: .8;
}
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  width: 100%; padding: 9px 2px 8px; border: 1px solid transparent; border-radius: 12px;
  background: transparent; color: var(--muted); transition: all .13s ease;
}
.tool:hover { background: rgba(61,214,181,.07); border-color: rgba(61,214,181,.28); color: #fff; }
.tool svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool .tl {
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
}

/* Stage */
.stage-wrap { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.stage-wrap::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(700px 700px at 90% -12%, rgba(64,136,207,.16), transparent 65%),
    radial-gradient(560px 560px at -6% 115%, rgba(61,214,181,.08), transparent 62%);
}
#stage { position: relative; z-index: 1; box-shadow: 0 18px 60px rgba(0,0,0,.5); border-radius: 4px; }
#stage .canvas-container { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }

/* Right inspector */
.inspector {
  flex: 0 0 252px; background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; padding: 16px 16px 26px; display: flex; flex-direction: column; gap: 20px;
}
.inspector::-webkit-scrollbar { width: 0; }
.isec { display: flex; flex-direction: column; gap: 9px; }
.isec .lbl {
  font-family: 'DM Mono', monospace; font-size: 10.5px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--label);
}
#insEmpty { font-size: 12.5px; color: var(--label); line-height: 1.6; padding: 4px 0; }
.swrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.sw {
  width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line);
  padding: 0; transition: transform .1s ease, border-color .1s ease;
}
.sw:hover { transform: scale(1.1); }
.sw.on { border: 2px solid var(--mint); box-shadow: 0 0 0 2px rgba(61,214,181,.25); }
select.ictl, input.ictl {
  width: 100%; font-family: 'DM Sans', sans-serif; font-size: 13px; color: #fff;
  background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 10px;
}
select.ictl:focus, input.ictl:focus { outline: none; border-color: var(--mint); }
select.ictl option { background: var(--navy); color: #fff; }
.irow { display: flex; gap: 7px; }
.irow > * { flex: 1; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button {
  flex: 1; padding: 7px 0; background: transparent; border: none; color: var(--muted);
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .06em;
}
.seg button.on { background: var(--mint); color: var(--navy); font-weight: 500; }
input[type=range] { width: 100%; accent-color: var(--mint); }
.act {
  padding: 8px 6px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.03);
  color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  letter-spacing: .08em; text-transform: uppercase; transition: all .13s ease;
}
.act:hover { border-color: rgba(61,214,181,.5); color: #fff; }
.act.danger:hover { border-color: rgba(255,110,110,.6); color: #FF9C9C; }
.agrid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

/* ── Filmstrip ───────────────────────────────────────────── */
.filmstrip {
  flex: 0 0 122px; background: var(--panel); border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px; padding: 0 16px; z-index: 20;
}
#thumbs { flex: 1; display: flex; gap: 10px; overflow-x: auto; padding: 10px 2px; min-width: 0; }
#thumbs::-webkit-scrollbar { height: 5px; }
#thumbs::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 3px; }
.thumb {
  flex: 0 0 142px; height: 80px; border-radius: 9px; border: 2px solid var(--line);
  background: var(--navy) center/cover no-repeat; position: relative; cursor: pointer;
  transition: border-color .13s ease;
}
.thumb:hover { border-color: rgba(61,214,181,.55); }
.thumb.on { border-color: var(--mint); box-shadow: 0 0 0 2px rgba(61,214,181,.22); }
.thumb .n {
  position: absolute; left: 6px; bottom: 5px; font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--muted); background: rgba(5,23,41,.8);
  padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line);
}
.fs-actions { display: flex; flex-direction: column; gap: 6px; }
.fs-actions .row { display: flex; gap: 6px; }
.fsbtn {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.03);
  color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  letter-spacing: .08em; text-transform: uppercase; transition: all .13s ease; white-space: nowrap;
}
.fsbtn:hover { border-color: rgba(61,214,181,.5); color: #fff; }

/* ── Toasts ──────────────────────────────────────────────── */
#toasts { position: fixed; right: 20px; bottom: 138px; z-index: 90; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: var(--panel); border: 1px solid rgba(61,214,181,.4); border-radius: 13px;
  padding: 13px 17px; font-size: 13.5px; color: #fff; max-width: 340px;
  box-shadow: 0 12px 34px rgba(0,0,0,.45); animation: tin .18s ease;
}
.toast.err { border-color: rgba(255,110,110,.5); }
.toast a { color: var(--mint); font-weight: 500; text-decoration: none; }
.toast a:hover { text-decoration: underline; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="home" href="index.html">&larr; Kit home</a>
  <div class="divider"></div>
  <span class="brand">Design Studio</span>
  <input id="deckTitle" value="Untitled deck" spellcheck="false" aria-label="Deck title">
  <div class="spacer"></div>
  <button class="btn" id="exportBtn">Export PNG</button>
  <button class="btn primary" id="saveBtn">Save to kit</button>
</div>

<div class="main">
  <div class="tools">
    <div class="tgroup">Text</div>
    <button class="tool" data-add="heading" title="Add a Manrope heading">
      <svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14"/></svg><span class="tl">Heading</span>
    </button>
    <button class="tool" data-add="body" title="Add DM Sans body text">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span class="tl">Body</span>
    </button>
    <div class="tgroup">Shapes</div>
    <button class="tool" data-add="rect" title="Rectangle">
      <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg><span class="tl">Rect</span>
    </button>
    <button class="tool" data-add="pill" title="Pill">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/></svg><span class="tl">Pill</span>
    </button>
    <button class="tool" data-add="circle" title="Circle">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg><span class="tl">Circle</span>
    </button>
    <button class="tool" data-add="line" title="Line">
      <svg viewBox="0 0 24 24"><path d="M4 19L20 5"/></svg><span class="tl">Line</span>
    </button>
    <div class="tgroup">Media</div>
    <button class="tool" id="imageBtn" title="Insert an image from your computer">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg><span class="tl">Image</span>
    </button>
    <button class="tool" id="logoBtn" title="Insert the FreightPOP white logo (needs internet)">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span class="tl">Logo</span>
    </button>
    <div class="tgroup">Layouts</div>
    <button class="tool" data-layout="title" title="Title slide starter layout">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M6 10h7M6 14h10"/></svg><span class="tl">Title</span>
    </button>
    <button class="tool" data-layout="bullets" title="Bullet-list starter layout">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="8" r="1.2" fill="currentColor"/><circle cx="6" cy="12" r="1.2" fill="currentColor"/><circle cx="6" cy="16" r="1.2" fill="currentColor"/><path d="M10 8h9M10 12h9M10 16h9"/></svg><span class="tl">Bullets</span>
    </button>
    <button class="tool" data-layout="stat" title="Big stat starter layout">
      <svg viewBox="0 0 24 24"><path d="M6 16V9M12 16V5M18 16v-5M4 20h16"/></svg><span class="tl">Big stat</span>
    </button>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  </div>

  <div class="inspector">
    <div id="insEmpty">Select an object on the canvas to edit its fill, type, opacity and layering.<br><br>Tips: double-click text to edit &middot; &#8984;D duplicates &middot; arrows nudge &middot; Delete removes.</div>
    <div id="insObject" style="display:none; flex-direction:column; gap:20px;">
      <div class="isec">
        <div class="lbl" id="fillLbl">Fill</div>
        <div class="swrow" id="fillSwatches"></div>
      </div>
      <div class="isec" id="textSection" style="display:none;">
        <div class="lbl">Type</div>
        <select class="ictl" id="fontFamily">
          <option value="Manrope">Manrope</option>
          <option value="DM Sans">DM Sans</option>
          <option value="DM Mono">DM Mono</option>
        </select>
        <div class="irow">
          <input class="ictl" id="fontSize" type="number" min="8" max="600" step="2" title="Font size">
          <div class="seg" id="weightSeg">
            <button data-w="400">400</button>
            <button data-w="500">500</button>
          </div>
        </div>
      </div>
      <div class="isec">
        <div class="lbl">Opacity — <span id="opVal">100</span>%</div>
        <input type="range" id="opacity" min="0" max="100" value="100">
      </div>
      <div class="isec">
        <div class="lbl">Arrange</div>
        <div class="agrid">
          <button class="act" id="layerUp">Layer &uarr;</button>
          <button class="act" id="layerDown">Layer &darr;</button>
          <button class="act" id="dupObj">Duplicate</button>
          <button class="act danger" id="delObj">Delete</button>
        </div>
      </div>
    </div>
    <div class="isec">
      <div class="lbl">Canvas background</div>
      <div class="swrow" id="bgSwatches"></div>
    </div>
  </div>
</div>

<div class="filmstrip">
  <div id="thumbs"></div>
  <div class="fs-actions">
    <div class="row">
      <button class="fsbtn" id="addSlide">+ Slide</button>
      <button class="fsbtn" id="dupSlide">Duplicate</button>
      <button class="fsbtn" id="delSlide">Delete</button>
    </div>
    <div class="row">
      <button class="fsbtn" id="moveL" title="Move slide left">&#9664;</button>
      <button class="fsbtn" id="moveR" title="Move slide right">&#9654;</button>
      <span class="mono" id="slideCounter" style="align-self:center; padding-left:4px;">1 / 1</span>
    </div>
  </div>
</div>

<input type="file" id="imageInput" accept="image/*" style="display:none;">
<div id="toasts"></div>

<script>
(function () {
  'use strict';
  var W = 1920, H = 1080;
  var NAVY = '#051729', MINT = '#3DD6B5', WHITE = '#FFFFFF', MUTED = '#B5CDE0';
  var SWATCHES = ['#051729', '#FFFFFF', '#4088CF', '#3DD6B5', '#0F7B6C', '#3AADBC', '#0A3D6B', '#4CAF85', '#7A96B0', '#B5CDE0'];
  var BG_SWATCHES = ['#051729', '#FFFFFF'];
  var LOGO_URL = 'https://info.freightpop.com/hubfs/FPLogos/full-white-logo.png';

  var $ = function (id) { return document.getElementById(id); };

  // ── Fabric defaults (brand selection chrome) ─────────────
  fabric.Object.prototype.set({
    borderColor: MINT, cornerColor: MINT, cornerStrokeColor: NAVY,
    cornerSize: 22, touchCornerSize: 30, transparentCorners: false,
    cornerStyle: 'circle', borderScaleFactor: 2.5, padding: 2,
  });

  var canvas = new fabric.Canvas('c', {
    width: W, height: H,
    backgroundColor: NAVY,
    preserveObjectStacking: true,
    enableRetinaScaling: false,
    selectionColor: 'rgba(61,214,181,.10)',
    selectionBorderColor: MINT,
    selectionLineWidth: 2,
  });

  // ── Slides model ─────────────────────────────────────────
  function blankJSON() { return { version: fabric.version, objects: [], background: NAVY }; }
  var slides = [{ json: blankJSON(), thumb: null }];
  var cur = 0;
  var deckSlug = null;
  var loading = false;   // suppress dirty-events while loadFromJSON runs
  var saving = false;

  // ── Display scaling: backing store stays 1920×1080; the canvas
  // elements are downscaled with CSS only (Fabric's getPointer divides
  // by the element bounds, so pointer math stays correct). ──
  function fitStage() {
    var wrap = $('stageWrap');
    var availW = wrap.clientWidth - 56, availH = wrap.clientHeight - 56;
    if (availW < 50 || availH < 50) return;
    var s = Math.min(availW / W, availH / H, 1);
    canvas.setDimensions({ width: Math.round(W * s) + 'px', height: Math.round(H * s) + 'px' }, { cssOnly: true });
    canvas.calcOffset();
  }
  window.addEventListener('resize', fitStage);
  if (window.ResizeObserver) new ResizeObserver(fitStage).observe($('stageWrap'));
  fitStage();

  // ── Toasts ───────────────────────────────────────────────
  function toast(msg, opts) {
    opts = opts || {};
    var el = document.createElement('div');
    el.className = 'toast' + (opts.error ? ' err' : '');
    el.textContent = msg;
    if (opts.linkHref) {
      el.appendChild(document.createElement('br'));
      var a = document.createElement('a');
      a.href = opts.linkHref; a.target = '_blank'; a.textContent = opts.linkText || 'Open →';
      el.appendChild(a);
    }
    $('toasts').appendChild(el);
    setTimeout(function () { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, opts.error ? 6500 : 5200);
    setTimeout(function () { el.remove(); }, opts.error ? 7000 : 5700);
  }

  // ── Dirty tracking → thumbnail refresh ───────────────────
  var thumbTimer = null;
  function markDirty() {
    if (loading) return;
    clearTimeout(thumbTimer);
    thumbTimer = setTimeout(function () {
      slides[cur].thumb = canvas.toDataURL({ format: 'png', multiplier: 220 / W });
      paintThumbs();
    }, 250);
  }
  canvas.on('object:modified', markDirty);
  canvas.on('object:added', markDirty);
  canvas.on('object:removed', markDirty);
  canvas.on('text:changed', markDirty);

  // ── Filmstrip ────────────────────────────────────────────
  function paintThumbs() {
    var box = $('thumbs');
    box.innerHTML = '';
    slides.forEach(function (s, i) {
      var t = document.createElement('div');
      t.className = 'thumb' + (i === cur ? ' on' : '');
      if (s.thumb) t.style.backgroundImage = 'url(' + s.thumb + ')';
      var n = document.createElement('span');
      n.className = 'n'; n.textContent = i + 1;
      t.appendChild(n);
      t.onclick = function () { if (i !== cur) openSlide(i); };
      box.appendChild(t);
    });
    $('slideCounter').textContent = (cur + 1) + ' / ' + slides.length;
  }

  function commitCurrent() {
    slides[cur].json = canvas.toJSON();
    slides[cur].thumb = canvas.toDataURL({ format: 'png', multiplier: 220 / W });
  }

  function openSlide(i, cb) {
    if (!loading && cur >= 0 && slides[cur]) commitCurrent();
    cur = i;
    loading = true;
    canvas.discardActiveObject();
    canvas.loadFromJSON(slides[i].json || blankJSON(), function () {
      if (!canvas.backgroundColor) canvas.setBackgroundColor(NAVY, function () {});
      canvas.renderAll();
      loading = false;
      slides[i].thumb = canvas.toDataURL({ format: 'png', multiplier: 220 / W });
      paintThumbs();
      refreshInspector();
      if (cb) cb();
    });
  }

  $('addSlide').onclick = function () {
    commitCurrent();
    slides.splice(cur + 1, 0, { json: blankJSON(), thumb: null });
    openSlide(cur + 1);
  };
  $('dupSlide').onclick = function () {
    commitCurrent();
    slides.splice(cur + 1, 0, { json: JSON.parse(JSON.stringify(slides[cur].json)), thumb: slides[cur].thumb });
    openSlide(cur + 1);
  };
  $('delSlide').onclick = function () {
    if (slides.length <= 1) { toast('A deck needs at least one slide.', { error: true }); return; }
    slides.splice(cur, 1);
    cur = Math.min(cur, slides.length - 1);
    var target = cur; cur = -1;               // force reload without recommit of deleted slide
    loading = true;
    canvas.loadFromJSON(slides[target].json || blankJSON(), function () {
      cur = target; loading = false;
      canvas.renderAll();
      slides[cur].thumb = canvas.toDataURL({ format: 'png', multiplier: 220 / W });
      paintThumbs(); refreshInspector();
    });
  };
  $('moveL').onclick = function () {
    if (cur === 0) return;
    commitCurrent();
    var s = slides.splice(cur, 1)[0];
    slides.splice(cur - 1, 0, s); cur -= 1; paintThumbs();
  };
  $('moveR').onclick = function () {
    if (cur >= slides.length - 1) return;
    commitCurrent();
    var s = slides.splice(cur, 1)[0];
    slides.splice(cur + 1, 0, s); cur += 1; paintThumbs();
  };

  // ── Insert tools ─────────────────────────────────────────
  function addAndSelect(obj) {
    canvas.add(obj);
    canvas.setActiveObject(obj);
    canvas.requestRenderAll();
  }

  var ADDERS = {
    heading: function () {
      addAndSelect(new fabric.IText('Double-click to edit', {
        fontFamily: 'Manrope', fontWeight: 500, fontSize: 84, fill: WHITE,
        left: W / 2, top: H / 2 - 90, originX: 'center', originY: 'center',
      }));
    },
    body: function () {
      addAndSelect(new fabric.IText('Double-click to edit', {
        fontFamily: 'DM Sans', fontWeight: 400, fontSize: 42, fill: MUTED,
        left: W / 2, top: H / 2 + 40, originX: 'center', originY: 'center',
      }));
    },
    rect: function () {
      addAndSelect(new fabric.Rect({
        width: 460, height: 300, fill: MINT, rx: 14, ry: 14,
        left: W / 2, top: H / 2, originX: 'center', originY: 'center',
      }));
    },
    pill: function () {
      addAndSelect(new fabric.Rect({
        width: 420, height: 96, fill: '#0A3D6B', rx: 999, ry: 999,
        left: W / 2, top: H / 2, originX: 'center', originY: 'center',
      }));
    },
    circle: function () {
      addAndSelect(new fabric.Circle({
        radius: 160, fill: MINT,
        left: W / 2, top: H / 2, originX: 'center', originY: 'center',
      }));
    },
    line: function () {
      addAndSelect(new fabric.Line([0, 0, 520, 0], {
        stroke: MINT, strokeWidth: 6,
        left: W / 2, top: H / 2, originX: 'center', originY: 'center',
      }));
    },
  };
  document.querySelectorAll('.tool[data-add]').forEach(function (b) {
    b.onclick = function () { ADDERS[b.dataset.add](); };
  });

  // Image upload
  $('imageBtn').onclick = function () { $('imageInput').click(); };
  $('imageInput').onchange = function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      fabric.Image.fromURL(r.result, function (img) {
        var s = Math.min((W * 0.4) / img.width, (H * 0.4) / img.height, 1);
        img.set({ left: W / 2, top: H / 2, originX: 'center', originY: 'center', scaleX: s, scaleY: s });
        addAndSelect(img);
      });
    };
    r.readAsDataURL(f);
  };

  // Logo (remote — needs internet)
  $('logoBtn').onclick = function () {
    fabric.Image.fromURL(LOGO_URL, function (img, isError) {
      if (isError || !img || !img.width) {
        toast('Could not load the FreightPOP logo — this button needs an internet connection.', { error: true });
        return;
      }
      var s = 480 / img.width;
      img.set({ left: W / 2, top: H / 2, originX: 'center', originY: 'center', scaleX: s, scaleY: s });
      addAndSelect(img);
    }, { crossOrigin: 'anonymous' });
  };

  // ── Starter layouts ──────────────────────────────────────
  function applyLayout(objects, bg) {
    if (canvas.getObjects().length &&
        !window.confirm('Replace the contents of this slide with the starter layout?')) return;
    loading = true;
    canvas.discardActiveObject();
    canvas.remove.apply(canvas, canvas.getObjects().slice());
    canvas.setBackgroundColor(bg || NAVY, function () {});
    objects.forEach(function (o) { canvas.add(o); });
    canvas.renderAll();
    loading = false;
    markDirty();
    refreshInspector();
  }

  var LAYOUTS = {
    title: function () {
      applyLayout([
        new fabric.Rect({ left: 160, top: 356, width: 64, height: 5, fill: MINT }),
        new fabric.IText('FREIGHTPOP', {
          left: 160, top: 396, fontFamily: 'DM Mono', fontWeight: 500,
          fontSize: 30, fill: MINT, charSpacing: 320,
        }),
        new fabric.Textbox('Deck title goes here', {
          left: 160, top: 460, width: 1440, fontFamily: 'Manrope', fontWeight: 500,
          fontSize: 116, fill: WHITE, lineHeight: 1.06,
        }),
        new fabric.Textbox('A short supporting subtitle — double-click any text to edit it.', {
          left: 160, top: 660, width: 1180, fontFamily: 'DM Sans', fontWeight: 400,
          fontSize: 42, fill: MUTED, lineHeight: 1.4,
        }),
      ]);
    },
    bullets: function () {
      var objs = [
        new fabric.Textbox('Headline goes here', {
          left: 150, top: 120, width: 1620, fontFamily: 'Manrope', fontWeight: 500,
          fontSize: 76, fill: WHITE, lineHeight: 1.08,
        }),
      ];
      for (var i = 0; i < 4; i++) {
        var y = 330 + i * 158;
        objs.push(new fabric.Circle({ left: 165, top: y + 15, radius: 11, fill: MINT }));
        objs.push(new fabric.Textbox('Bullet point ' + (i + 1) + ' — double-click to edit', {
          left: 220, top: y, width: 1480, fontFamily: 'DM Sans', fontWeight: 400,
          fontSize: 42, fill: '#DFE9F3', lineHeight: 1.35,
        }));
      }
      applyLayout(objs);
    },
    stat: function () {
      applyLayout([
        new fabric.IText('THE HEADLINE NUMBER', {
          left: W / 2, top: 260, originX: 'center', fontFamily: 'DM Mono', fontWeight: 500,
          fontSize: 30, fill: '#7A96B0', charSpacing: 300,
        }),
        new fabric.IText('38%', {
          left: W / 2, top: 520, originX: 'center', originY: 'center',
          fontFamily: 'Manrope', fontWeight: 500, fontSize: 340, fill: MINT,
        }),
        new fabric.Textbox('lower freight spend — double-click to edit this label', {
          left: W / 2, top: 740, originX: 'center', width: 1100, textAlign: 'center',
          fontFamily: 'DM Sans', fontWeight: 400, fontSize: 44, fill: MUTED, lineHeight: 1.4,
        }),
      ]);
    },
  };
  document.querySelectorAll('.tool[data-layout]').forEach(function (b) {
    b.onclick = function () { LAYOUTS[b.dataset.layout](); };
  });

  // ── Inspector ────────────────────────────────────────────
  function buildSwatches(rowEl, colors, onPick) {
    rowEl.innerHTML = '';
    colors.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'sw'; b.style.background = c; b.title = c; b.dataset.c = c.toLowerCase();
      b.onclick = function () { onPick(c); };
      rowEl.appendChild(b);
    });
  }

  buildSwatches($('fillSwatches'), SWATCHES, function (c) {
    var objs = canvas.getActiveObjects();
    objs.forEach(function (o) {
      if (o.type === 'line') o.set('stroke', c);
      else o.set('fill', c);
    });
    canvas.requestRenderAll(); markDirty(); refreshInspector();
  });

  buildSwatches($('bgSwatches'), BG_SWATCHES, function (c) {
    canvas.setBackgroundColor(c, function () {
      canvas.requestRenderAll(); markDirty(); refreshBgSwatches();
    });
  });

  function refreshBgSwatches() {
    var bg = String(canvas.backgroundColor || NAVY).toLowerCase();
    $('bgSwatches').querySelectorAll('.sw').forEach(function (b) {
      b.classList.toggle('on', b.dataset.c === bg);
    });
  }

  function refreshInspector() {
    var a = canvas.getActiveObject();
    refreshBgSwatches();
    if (!a) { $('insEmpty').style.display = 'block'; $('insObject').style.display = 'none'; return; }
    $('insEmpty').style.display = 'none';
    $('insObject').style.display = 'flex';

    var isLine = a.type === 'line';
    $('fillLbl').textContent = isLine ? 'Stroke' : 'Fill';
    var cval = String((isLine ? a.stroke : a.fill) || '').toLowerCase();
    $('fillSwatches').querySelectorAll('.sw').forEach(function (b) {
      b.classList.toggle('on', b.dataset.c === cval);
    });

    var isText = a.type === 'i-text' || a.type === 'textbox' || a.type === 'text';
    $('textSection').style.display = isText ? 'flex' : 'none';
    if (isText) {
      $('fontFamily').value = a.fontFamily || 'Manrope';
      $('fontSize').value = Math.round(a.fontSize || 40);
      $('weightSeg').querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('on', String(a.fontWeight || 400) === b.dataset.w);
      });
    }
    var op = Math.round((a.opacity == null ? 1 : a.opacity) * 100);
    $('opacity').value = op; $('opVal').textContent = op;
  }

  canvas.on('selection:created', refreshInspector);
  canvas.on('selection:updated', refreshInspector);
  canvas.on('selection:cleared', refreshInspector);

  $('fontFamily').onchange = function () {
    var a = canvas.getActiveObject();
    if (a && a.set) { a.set('fontFamily', this.value); canvas.requestRenderAll(); markDirty(); }
  };
  $('fontSize').onchange = function () {
    var a = canvas.getActiveObject(), v = parseInt(this.value, 10);
    if (a && v > 0) { a.set('fontSize', v); canvas.requestRenderAll(); markDirty(); }
  };
  $('weightSeg').querySelectorAll('button').forEach(function (b) {
    b.onclick = function () {
      var a = canvas.getActiveObject();
      if (a) { a.set('fontWeight', parseInt(b.dataset.w, 10)); canvas.requestRenderAll(); markDirty(); refreshInspector(); }
    };
  });
  $('opacity').oninput = function () {
    var a = canvas.getActiveObject();
    if (a) { a.set('opacity', this.value / 100); $('opVal').textContent = this.value; canvas.requestRenderAll(); }
  };
  $('opacity').onchange = markDirty;
  $('layerUp').onclick = function () {
    var a = canvas.getActiveObject();
    if (a) { canvas.bringForward(a); canvas.requestRenderAll(); markDirty(); }
  };
  $('layerDown').onclick = function () {
    var a = canvas.getActiveObject();
    if (a) { canvas.sendBackwards(a); canvas.requestRenderAll(); markDirty(); }
  };
  $('dupObj').onclick = duplicateSelection;
  $('delObj').onclick = deleteSelection;

  function duplicateSelection() {
    var a = canvas.getActiveObject();
    if (!a) return;
    a.clone(function (cl) {
      canvas.discardActiveObject();
      cl.set({ left: (a.left || 0) + 30, top: (a.top || 0) + 30, evented: true });
      if (cl.type === 'activeSelection') {
        cl.canvas = canvas;
        cl.forEachObject(function (o) { canvas.add(o); });
        cl.setCoords();
      } else {
        canvas.add(cl);
      }
      canvas.setActiveObject(cl);
      canvas.requestRenderAll();
      markDirty();
    });
  }
  function deleteSelection() {
    var objs = canvas.getActiveObjects();
    if (!objs.length) return;
    canvas.discardActiveObject();
    objs.forEach(function (o) { canvas.remove(o); });
    canvas.requestRenderAll();
    refreshInspector();
  }

  // ── Keyboard ─────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    var a = canvas.getActiveObject();
    if (a && a.isEditing) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
    if ((e.metaKey || e.ctrlKey) && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); duplicateSelection(); return; }
    if (a && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) !== -1) {
      e.preventDefault();
      var d = e.shiftKey ? 12 : 3;
      if (e.key === 'ArrowUp') a.top -= d;
      if (e.key === 'ArrowDown') a.top += d;
      if (e.key === 'ArrowLeft') a.left -= d;
      if (e.key === 'ArrowRight') a.left += d;
      a.setCoords();
      canvas.requestRenderAll();
      markDirty();
    }
  });

  // ── Export current slide as PNG ──────────────────────────
  $('exportBtn').onclick = function () {
    var url = canvas.toDataURL({ format: 'png', multiplier: 1 });   // backing store is full 1920×1080
    var a = document.createElement('a');
    var base = ($('deckTitle').value.trim() || 'slide').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'slide';
    a.download = base + '-slide-' + (cur + 1) + '.png';
    a.href = url;
    a.click();
  };

  // ── Save to kit ──────────────────────────────────────────
  function renderSlidePNG(json) {
    return new Promise(function (resolve, reject) {
      var sc = new fabric.StaticCanvas(null, { width: W, height: H, enableRetinaScaling: false });
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; try { sc.dispose(); } catch (e) {} reject(new Error('slide render timed out')); } }, 20000);
      sc.loadFromJSON(json || blankJSON(), function () {
        if (done) return;
        done = true; clearTimeout(t);
        if (!sc.backgroundColor) sc.setBackgroundColor(NAVY, function () {});
        sc.renderAll();
        var url = sc.toDataURL({ format: 'png', multiplier: 1 });
        try { sc.dispose(); } catch (e) {}
        resolve(url);
      });
    });
  }

  var lastSave = null;
  function save() {
    if (saving) return Promise.resolve(null);
    commitCurrent();
    saving = true;
    var btn = $('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    var title = $('deckTitle').value.trim() || 'Untitled deck';
    return Promise.all(slides.map(function (s) { return renderSlidePNG(s.json); }))
      .then(function (pngs) {
        var body = { title: title, slides: slides.map(function (s, i) { return { png: pngs[i], json: s.json }; }) };
        if (deckSlug) body.slug = deckSlug;
        return fetch('/api/design', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      })
      .then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        if (!x.r.ok || !x.j.ok) throw new Error((x.j && x.j.error) || ('HTTP ' + x.r.status));
        deckSlug = x.j.slug;
        lastSave = x.j;
        try { history.replaceState(null, '', 'design.html?slug=' + encodeURIComponent(x.j.slug)); } catch (e) {}
        toast('Saved to kit — “' + title + '” (' + slides.length + ' slide' + (slides.length === 1 ? '' : 's') + ')', {
          linkHref: x.j.presentUrl, linkText: 'Present deck →',
        });
        return x.j;
      })
      .catch(function (e) {
        toast('Save failed: ' + e.message, { error: true });
        throw e;
      })
      .finally(function () {
        saving = false;
        btn.disabled = false; btn.textContent = 'Save to kit';
      });
  }
  $('saveBtn').onclick = function () { save().catch(function () {}); };

  // ── Open an existing design (?slug=) ─────────────────────
  function thumbFromJSON(json, i) {
    return renderSlidePNG(json).then(function (full) {
      // downscale via an offscreen image → small canvas
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () {
          var c2 = document.createElement('canvas');
          c2.width = 220; c2.height = Math.round(220 * H / W);
          c2.getContext('2d').drawImage(img, 0, 0, c2.width, c2.height);
          slides[i].thumb = c2.toDataURL('image/png');
          resolve();
        };
        img.onerror = function () { resolve(); };
        img.src = full;
      });
    }).catch(function () {});
  }

  function boot() {
    var qs = new URLSearchParams(location.search);
    var slug = qs.get('slug');
    if (!slug) { openSlide(0); markReady(); return; }
    fetch('/api/design?slug=' + encodeURIComponent(slug))
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        deckSlug = d.slug;
        $('deckTitle').value = d.title || 'Untitled deck';
        var srcSlides = (d.slides && d.slides.length) ? d.slides : [{ json: blankJSON() }];
        slides = srcSlides.map(function (s) { return { json: s.json || blankJSON(), thumb: null }; });
        cur = -1;   // the live canvas is still blank — do NOT commit it over the fetched slide 0
        openSlide(0, markReady);
        // Background-render thumbnails for the other slides.
        slides.forEach(function (s, i) { if (i !== 0) thumbFromJSON(s.json, i).then(paintThumbs); });
      })
      .catch(function (e) {
        toast('Could not open design “' + slug + '”: ' + e.message, { error: true });
        deckSlug = null;
        openSlide(0); markReady();
      });
  }

  var ready = false;
  function markReady() { ready = true; }

  // Re-render once webfonts land so Manrope/DM Sans/DM Mono measure correctly.
  if (document.fonts && document.fonts.ready) {
    Promise.all([
      document.fonts.load('500 84px Manrope'),
      document.fonts.load('400 84px Manrope'),
      document.fonts.load('400 42px "DM Sans"'),
      document.fonts.load('500 42px "DM Sans"'),
      document.fonts.load('500 30px "DM Mono"'),
      document.fonts.load('400 30px "DM Mono"'),
    ]).catch(function () {}).then(function () {
      canvas.getObjects().forEach(function (o) { if (o.initDimensions) o.initDimensions(); o.setCoords(); });
      canvas.requestRenderAll();
      if (!loading && slides[cur]) markDirty();
    });
  }

  paintThumbs();
  boot();

  // Small programmatic surface (also used by headless verification).
  window.FPDesign = {
    canvas: canvas,
    save: save,
    openSlide: openSlide,
    addLayout: function (k) { LAYOUTS[k](); },
    addShape: function (k) { ADDERS[k](); },
    slides: function () { return slides; },
    slug: function () { return deckSlug; },
    lastSave: function () { return lastSave; },
    isReady: function () { return ready; },
  };
})();
</script>
</body>
</html>
