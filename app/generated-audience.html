<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FreightPOP — Generated Deck</title>
<link rel="stylesheet" href="core/styles.css">
</head>
<body class="audience-body">
  <div id="audience-stage"></div>
  <div id="blackout"></div>
  <div id="progress"></div>
  <div id="audience-hint">Click me once, then press <b>F</b> for fullscreen · double-click also works</div>
  <script>
  (function(){
    var slug=(new URLSearchParams(location.search).get("deck")||"").replace(/[^a-z0-9-]/gi,"");
    var chain=["../deck/manifest-generated-"+slug+".js","core/sync.js","core/framework.js","core/audience.js"];
    (function next(i){ if(i>=chain.length) return; var s=document.createElement("script"); s.src=chain[i]; s.onload=function(){next(i+1);}; s.onerror=function(){next(i+1);}; document.body.appendChild(s); })(0);
  })();
  </script>
</body>
</html>
