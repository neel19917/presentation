<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreightPOP — Deck Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#051729; --panel:#0A2540; --panel-2:#0b1f38; --field:#0b1f38;
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06);
  --mint:#3DD6B5; --muted:#B5CDE0; --label:#7A96B0; --white:#fff;
  --danger:#e8a06b; --warn:#e8c46b;
  --r-lg:16px; --r-md:12px; --r-sm:9px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1300px 640px at 78% -18%,#123a66 0%,var(--navy) 55%),var(--navy);
  color:var(--white); -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,textarea,select{font-family:inherit;}

/* ── App shell ─────────────────────────────────────────── */
.app{display:grid; grid-template-columns:300px 1fr; height:100vh;}
.rail{
  border-right:1px solid var(--line); background:rgba(5,23,41,.55);
  display:flex; flex-direction:column; min-height:0;
}
.rail-top{padding:20px 20px 14px; border-bottom:1px solid var(--line);}
.brandmark{font-family:'Manrope',sans-serif; font-weight:500; font-size:18px; letter-spacing:-.01em;}
.brandmark .dot{color:var(--mint);}
.brandsub{font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--label); margin-top:6px;}
.rail-scroll{overflow-y:auto; padding:12px 10px 40px; flex:1; min-height:0;}

.group{margin-bottom:10px;}
.group > .g-head{
  font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--label); padding:10px 10px 6px;
}
.tree-item{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  background:transparent; border:0; color:var(--muted); cursor:pointer;
  padding:8px 10px; border-radius:var(--r-sm); font-size:13.5px; line-height:1.3;
}
.tree-item:hover{background:rgba(255,255,255,.04); color:#fff;}
.tree-item.parent{font-weight:500; color:#dbe8f4;}
.tree-item.child{padding-left:30px; font-size:13px;}
.tree-item.child.grandchild{padding-left:44px; font-size:12.5px; color:#9db6cd;}
.tree-item.selected{background:rgba(61,214,181,.12); color:#fff; box-shadow:inset 2px 0 0 var(--mint);}
.tree-item .caret{width:12px; flex:0 0 12px; color:var(--label); transition:transform .12s ease; font-size:10px;}
.tree-item.open .caret{transform:rotate(90deg);}
.tree-item .num{font-family:'DM Mono',monospace; font-size:11px; color:var(--mint); flex:0 0 auto;}
.tree-item .txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tree-children{display:none;}
.tree-children.open{display:block;}
.pill{margin-left:auto; font-family:'DM Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--label); border:1px solid var(--line); border-radius:999px; padding:1px 7px;}

/* ── Right pane ────────────────────────────────────────── */
.pane{display:flex; flex-direction:column; min-height:0; min-width:0;}
.pane-head{
  display:flex; align-items:center; gap:16px; padding:16px 26px;
  border-bottom:1px solid var(--line); background:rgba(5,23,41,.4);
}
.ph-title{min-width:0; flex:1;}
.ph-kicker{font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--mint);}
.ph-name{font-family:'Manrope',sans-serif; font-weight:500; font-size:20px; letter-spacing:-.01em; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ph-actions{display:flex; align-items:center; gap:10px; flex:0 0 auto;}

.btn{
  border:1px solid var(--line); background:rgba(255,255,255,.04); color:#fff;
  padding:9px 16px; border-radius:var(--r-sm); font-size:13px; font-weight:500; cursor:pointer;
  transition:border-color .12s,background .12s;
}
.btn:hover{border-color:var(--mint); background:rgba(61,214,181,.06);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn.primary{background:var(--mint); color:var(--navy); border-color:var(--mint); font-weight:700;}
.btn.primary:hover{filter:brightness(1.05);}
.btn.ghost{padding:8px 12px;}
.toggle{display:inline-flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden;}
.toggle button{border:0; background:transparent; color:var(--muted); padding:8px 14px; font-size:12.5px; cursor:pointer;}
.toggle button.on{background:rgba(61,214,181,.14); color:#fff;}

.pane-body{flex:1; min-height:0; display:grid; grid-template-columns:1fr; overflow:hidden;}
.pane-body.split{grid-template-columns:minmax(420px,1fr) minmax(360px,44%);}
.editor-scroll{overflow-y:auto; padding:26px 30px 80px;}
.preview-wrap{border-left:1px solid var(--line); display:none; flex-direction:column; min-width:0; background:#04101d;}
.pane-body.split .preview-wrap{display:flex;}
.preview-bar{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--label);}
.preview-bar .url{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; color:var(--muted); text-transform:none; letter-spacing:0;}
.preview-frame{flex:1; border:0; width:100%; background:#04101d;}

/* ── Forms ─────────────────────────────────────────────── */
.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; color:var(--muted); gap:14px; padding:40px;}
.empty .em-mark{width:56px; height:56px; border-radius:14px; background:rgba(61,214,181,.1); border:1px solid rgba(61,214,181,.35); display:flex; align-items:center; justify-content:center; color:var(--mint); font-size:24px;}
.empty h2{font-family:'Manrope',sans-serif; font-weight:500; font-size:22px; color:#fff;}
.empty p{max-width:360px; line-height:1.6; font-size:14px;}

.section{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px 22px; margin-bottom:18px; box-shadow:inset 0 1px 0 var(--line-soft);}
.section > .sec-title{font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--mint); margin-bottom:16px;}
.field{margin-bottom:15px;}
.field:last-child{margin-bottom:0;}
.field > label{display:block; font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--label); margin-bottom:7px;}
.field .hint{font-size:11.5px; color:var(--label); margin-top:5px; line-height:1.4;}
.inp, textarea.inp, select.inp{
  width:100%; background:var(--field); border:1px solid var(--line); color:#fff;
  border-radius:var(--r-sm); padding:10px 12px; font-size:14px; line-height:1.45;
  transition:border-color .12s, box-shadow .12s;
}
textarea.inp{resize:vertical; min-height:74px;}
.inp:focus, textarea.inp:focus, select.inp:focus{outline:0; border-color:var(--mint); box-shadow:0 0 0 3px rgba(61,214,181,.18);}
.inp::placeholder,textarea.inp::placeholder{color:#4f6987;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.warn-line{display:flex; align-items:flex-start; gap:6px; margin-top:6px; font-size:12px; color:var(--warn); line-height:1.4;}
.warn-line[hidden]{display:none;}

/* list editor */
.list-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.list-item{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 12px 12px 14px; margin-bottom:10px; position:relative;}
.list-item .li-bar{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
.li-idx{font-family:'DM Mono',monospace; font-size:10px; color:var(--label); letter-spacing:.1em;}
.li-tools{margin-left:auto; display:flex; gap:5px;}
.icobtn{width:26px; height:26px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--muted); border-radius:7px; cursor:pointer; font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center;}
.icobtn:hover{border-color:var(--mint); color:#fff;}
.icobtn.rm:hover{border-color:var(--danger); color:var(--danger);}
.icobtn:disabled{opacity:.3; cursor:not-allowed;}
.add-btn{border:1px dashed var(--line); background:transparent; color:var(--mint); width:100%; padding:10px; border-radius:var(--r-sm); font-size:12.5px; cursor:pointer; letter-spacing:.02em;}
.add-btn:hover{border-color:var(--mint); background:rgba(61,214,181,.05);}

/* toast */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; background:#062031; border:1px solid var(--mint); color:#fff; padding:12px 20px; border-radius:var(--r-md); font-size:13.5px; box-shadow:0 12px 40px rgba(0,0,0,.5); transition:opacity .2s, transform .2s; z-index:50; display:flex; align-items:center; gap:10px;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.err{border-color:var(--danger);}
.toast .tk{color:var(--mint); font-family:'DM Mono',monospace; font-size:12px;}
.toast.err .tk{color:var(--danger);}

.revert-hint{font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:.05em; color:var(--label); margin-top:20px; padding-top:16px; border-top:1px solid var(--line); line-height:1.5;}
.savebar{display:flex; align-items:center; gap:12px; position:sticky; bottom:0; margin:0 -30px -80px; padding:16px 30px; background:linear-gradient(to top,var(--navy) 60%,rgba(5,23,41,0)); }
.save-status{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px;}
.spinner{width:14px; height:14px; border:2px solid rgba(61,214,181,.3); border-top-color:var(--mint); border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

.loading{padding:40px; color:var(--muted); display:flex; align-items:center; gap:10px; font-size:14px;}

/* home link */
.homelink{display:block; color:inherit; text-decoration:none;}
.homelink .kit-home{font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--label); margin-bottom:8px;}
.homelink:hover .kit-home{color:var(--mint);}

/* rail footer (sweep) */
.rail-foot{padding:12px; border-top:1px solid var(--line); flex:0 0 auto;}
.rail-foot .btn{width:100%;}

/* AI Clean review */
.review-wrap{border:1px solid rgba(61,214,181,.35); background:rgba(61,214,181,.05); border-radius:var(--r-lg); padding:18px 20px; margin-bottom:20px;}
.rv-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.rv-title{font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--mint); flex:1;}
.rv-group-title{font-family:'Manrope',sans-serif; font-weight:500; font-size:15px; color:#fff; margin:16px 0 10px; display:flex; align-items:center; gap:10px;}
.rv-group-title:first-of-type{margin-top:0;}
.rv-group-title .btn{margin-left:auto;}
.rv-card{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r-md); padding:13px 14px; margin-bottom:10px;}
.rv-card.accepted{border-color:rgba(61,214,181,.55);}
.rv-card.accepted .rv-actions{display:none;}
.rv-card.rejected{display:none;}
.rv-key{font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--label);}
.rv-old{color:#68809b; text-decoration:line-through; font-size:12.5px; line-height:1.5; margin-top:7px; white-space:pre-wrap;}
.rv-new{color:#fff; font-size:13.5px; line-height:1.5; margin-top:6px; white-space:pre-wrap;}
.rv-note{color:var(--mint); font-size:11.5px; line-height:1.4; margin-top:7px;}
.rv-state{font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--mint); margin-top:8px;}
.rv-actions{display:flex; gap:8px; margin-top:11px;}
.rv-actions .btn{padding:6px 13px; font-size:12px;}

/* sweep progress */
.prog{height:8px; background:var(--panel-2); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:14px 0 10px;}
.prog i{display:block; height:100%; width:0%; background:var(--mint); border-radius:999px; transition:width .25s ease;}
.prog-line{font-family:'DM Mono',monospace; font-size:11.5px; letter-spacing:.04em; color:var(--muted);}
.sweep-log{font-family:'DM Mono',monospace; font-size:11px; color:var(--label); margin-top:14px; max-height:180px; overflow-y:auto; line-height:1.7;}
.sweep-log .bad{color:var(--danger);}

/* modal */
.modal-back{position:fixed; inset:0; background:rgba(3,12,22,.72); display:flex; align-items:center; justify-content:center; z-index:60;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:24px 26px; max-width:480px; width:calc(100% - 48px); box-shadow:0 24px 80px rgba(0,0,0,.6);}
.modal h3{font-family:'Manrope',sans-serif; font-weight:500; font-size:19px; margin-bottom:10px;}
.modal p{font-size:13.5px; line-height:1.6; color:var(--muted); margin-bottom:18px;}
.modal .m-actions{display:flex; gap:10px; justify-content:flex-end;}
</style>
</head>
<body>
<div class="app">
  <!-- Left rail -->
  <aside class="rail">
    <div class="rail-top">
      <a class="homelink" href="index.html" title="Back to the kit launcher">
        <div class="kit-home">← Kit home</div>
        <div class="brandmark">FreightPOP<span class="dot">.</span> Deck Editor</div>
      </a>
      <div class="brandsub">Marketing content authoring</div>
    </div>
    <div class="rail-scroll" id="tree">
      <div class="loading"><span class="spinner"></span> Loading catalog…</div>
    </div>
    <div class="rail-foot">
      <button class="btn" id="sweepBtn" title="Run AI Clean over every module, deck screen and page">✨ Clean whole deck…</button>
    </div>
  </aside>

  <!-- Right pane -->
  <main class="pane">
    <div class="pane-head">
      <div class="ph-title">
        <div class="ph-kicker" id="phKicker">Deck Editor</div>
        <div class="ph-name" id="phName">Select something to edit</div>
      </div>
      <div class="ph-actions" id="phActions"></div>
    </div>
    <div class="pane-body" id="paneBody">
      <div class="editor-scroll" id="editor">
        <div id="reviewPanel"></div>
        <div id="formArea">
          <div class="empty">
            <div class="em-mark">✎</div>
            <h2>Pick a deck, page, or module</h2>
            <p>Choose an item from the left. Edit its content through the form, preview it live, then save — the interactive deck rebuilds itself.</p>
          </div>
        </div>
      </div>
      <div class="preview-wrap" id="previewWrap">
        <div class="preview-bar">
          <span>Preview</span>
          <span class="url" id="previewUrl"></span>
          <button class="icobtn" id="previewReload" title="Reload preview">⟳</button>
        </div>
        <iframe class="preview-frame" id="previewFrame" title="Live preview"></iframe>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"><span class="tk" id="toastK">✓</span><span id="toastMsg"></span></div>

<script>
"use strict";

// ── Constants ────────────────────────────────────────────
const BANNED = ["AI-powered","seamless","robust","game-changing","FreightPOP Intelligence"];
const PREVIEW_PAGE = {
  "erp-integrations": "/modules/erp-integrations.html",
  "roi-value": "/modules/roi-value.html",
  "real-ui": "/modules/product-ui.html",
  "netsuite-partners": "/modules/netsuite-partners.html",
  "acumatica-partners": "/modules/acumatica-partners.html",
  "stories": null, // presenter scripts — no visual preview, form only
};
const INTERACTIVE_PREVIEW = "/Presentation/TMSDeck-dev.html";

// ── Tiny DOM helpers ─────────────────────────────────────
function h(tag, attrs, kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else if (k.slice(0,2) === "on" && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === true) e.setAttribute(k,"");
    else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]);
  }
  if (kids != null) (Array.isArray(kids)?kids:[kids]).forEach(c=>{ if(c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
const $ = (id)=>document.getElementById(id);

// ── Brand guardrail ──────────────────────────────────────
function scanBanned(text){
  if (!text) return [];
  const low = String(text).toLowerCase();
  return BANNED.filter(p => low.includes(p.toLowerCase()));
}

// ── State ────────────────────────────────────────────────
let CATALOG = null;
let SEL = null;          // { target, kind, ... }
let WORK = null;         // working data clone (POSTed as-is)
let CURRENT_MODULE = null; // for feat: the module object inside WORK
let previewTarget = null;  // url string
let previewDc = null;      // interactive-deck state to jump the preview to {view,fi,step,sysKey}
let saving = false;
let RERENDER = null;       // re-renders the current form (used by AI Clean Accept)
let sweepAbort = false;    // set true to stop a running whole-deck sweep

// ── Field builders (bind directly onto an object) ────────
function warnEl(){ return h("div",{class:"warn-line",hidden:true}); }
function refreshWarn(w, val){
  const hits = scanBanned(val);
  if (hits.length){ w.hidden=false; w.textContent = "⚠ Off-brand phrase: " + hits.join(", "); }
  else w.hidden = true;
}
function textField(labelText, obj, key, opts){
  opts = opts||{};
  const w = warnEl();
  const ctrl = h(opts.textarea ? "textarea" : "input", {
    class:"inp", placeholder:opts.placeholder||"",
    ...(opts.textarea?{}:{ type:"text" }),
    oninput:(e)=>{ obj[key] = e.target.value; refreshWarn(w, e.target.value); }
  });
  ctrl.value = obj[key] == null ? "" : String(obj[key]);
  refreshWarn(w, ctrl.value);
  const f = h("div",{class:"field"},[ h("label",{text:labelText}), ctrl ]);
  if (opts.hint) f.appendChild(h("div",{class:"hint",text:opts.hint}));
  f.appendChild(w);
  return f;
}
function numField(labelText, obj, key){
  const ctrl = h("input",{class:"inp", type:"number",
    oninput:(e)=>{ obj[key] = e.target.value===""?null:Number(e.target.value); }});
  ctrl.value = obj[key] == null ? "" : obj[key];
  return h("div",{class:"field"},[ h("label",{text:labelText}), ctrl ]);
}
function twoCol(a,b){ const r=h("div",{class:"row2"}); r.appendChild(a); r.appendChild(b); return r; }

// Repeatable list of plain strings
function stringListField(labelText, arr, opts){
  opts = opts||{};
  const container = h("div");
  function render(){
    container.innerHTML = "";
    arr.forEach((val, i)=>{
      const w = warnEl();
      const ta = h("textarea",{class:"inp", style:"min-height:52px",
        oninput:(e)=>{ arr[i]=e.target.value; refreshWarn(w,e.target.value); }});
      ta.value = val==null?"":String(val);
      refreshWarn(w, ta.value);
      const tools = h("div",{class:"li-tools"},[
        h("button",{class:"icobtn", title:"Move up", disabled:i===0, onclick:()=>{ if(i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; render(); } }, text:"↑"}),
        h("button",{class:"icobtn", title:"Move down", disabled:i===arr.length-1, onclick:()=>{ if(i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; render(); } }, text:"↓"}),
        h("button",{class:"icobtn rm", title:"Remove", onclick:()=>{ arr.splice(i,1); render(); }, text:"✕"}),
      ]);
      const item = h("div",{class:"list-item"},[
        h("div",{class:"li-bar"},[ h("span",{class:"li-idx",text:(opts.itemLabel||"Item")+" "+(i+1)}), tools ]),
        ta, w
      ]);
      container.appendChild(item);
    });
    container.appendChild(h("button",{class:"add-btn", onclick:()=>{ arr.push(""); render(); }, text:"+ Add "+(opts.itemLabel||"item")}));
  }
  render();
  return h("div",{class:"field"},[ h("label",{text:labelText}), container ]);
}

// Repeatable list of objects, described by fieldDefs [{key,label,textarea?,placeholder?}]
function objectListField(labelText, arr, fieldDefs, makeNew, opts){
  opts = opts||{};
  const container = h("div");
  function render(){
    container.innerHTML = "";
    arr.forEach((obj, i)=>{
      const tools = h("div",{class:"li-tools"},[
        h("button",{class:"icobtn", title:"Move up", disabled:i===0, onclick:()=>{ if(i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; render(); } }, text:"↑"}),
        h("button",{class:"icobtn", title:"Move down", disabled:i===arr.length-1, onclick:()=>{ if(i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; render(); } }, text:"↓"}),
        h("button",{class:"icobtn rm", title:"Remove", onclick:()=>{ arr.splice(i,1); render(); }, text:"✕"}),
      ]);
      const card = h("div",{class:"list-item"},[
        h("div",{class:"li-bar"},[ h("span",{class:"li-idx",text:(opts.itemLabel||"Item")+" "+(i+1)}), tools ])
      ]);
      fieldDefs.forEach(fd=>{ card.appendChild(textField(fd.label, obj, fd.key, {textarea:fd.textarea, placeholder:fd.placeholder, hint:fd.hint})); });
      container.appendChild(card);
    });

let toastTimer=null;
function toast(msg, isErr){
  const t=$("toast"); $("toastMsg").textContent=msg; $("toastK").textContent=isErr?"✕":"✓";
  t.classList.toggle("err",!!isErr); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"), 3800);
}

// ── Read-only + structural helpers ───────────────────────
function roField(labelText, value, hint){
  const ctrl = h("input",{class:"inp", type:"text", disabled:true, style:"opacity:.55; cursor:not-allowed"});
  ctrl.value = value==null ? "" : String(value);
  const f = h("div",{class:"field"},[ h("label",{text:labelText}), ctrl ]);
  if (hint) f.appendChild(h("div",{class:"hint",text:hint}));
  return f;
}
// Fixed-length list of objects: roKeys shown read-only, editDefs editable.
// No add/remove/reorder — items are structural (1:1 with modules / built films).
function fixedObjectList(arr, roKeys, editDefs, opts){
  opts = opts||{};
  const container = h("div");
  (arr||[]).forEach((obj, i)=>{
    const idxBits = roKeys.map(k=>obj[k]).filter(v=>v!=null).join(" · ");
    const card = h("div",{class:"list-item"},[
      h("div",{class:"li-bar"},[ h("span",{class:"li-idx",text:(opts.itemLabel||"Item")+" "+(idxBits||String(i+1))}) ])
    ]);
    editDefs.forEach(fd=>{ card.appendChild(textField(fd.label, obj, fd.key, {textarea:fd.textarea, placeholder:fd.placeholder, hint:fd.hint})); });
    container.appendChild(card);
  });
  return container;
}
// Editable JSON blob bound to obj[key] (parsed on change; invalid JSON is not applied).
function jsonField(labelText, obj, key, hint){
  const w = warnEl();
  const ta = h("textarea",{class:"inp", style:"min-height:70px; font-family:'DM Mono',monospace; font-size:12px",
    onchange:(e)=>{
      const t=e.target.value.trim();
      try{
        if (t===""){ delete obj[key]; }
        else obj[key]=JSON.parse(t);
        w.hidden=true;
      }catch(err){ w.hidden=false; w.style.color="var(--danger)"; w.textContent="⚠ Invalid JSON — not applied"; }
    }});
  ta.value = obj[key]===undefined ? "" : JSON.stringify(obj[key], null, 2);
  const f = h("div",{class:"field"},[ h("label",{text:labelText}), ta ]);
  if (hint) f.appendChild(h("div",{class:"hint",text:hint}));
  f.appendChild(w);
  return f;
}

// ── Selection: deck screens (deck:copy / deck:sysdata#key / deck:workflows) ─
async function selectDeckScreen(entry){
  markSelected(entry.target);
  setHead("Deck screen", entry.label);
  showLoading();
  let j=null, errMsg=null;
  try{
    const r = await fetch("/api/content?target="+encodeURIComponent(entry.target));
    if (!r.ok) errMsg = "HTTP "+r.status;
    else j = await r.json();
  }catch(e){ errMsg = e.message||String(e); }
  if (!j || j.error){
    // Server may still be deploying this target — offer a retry instead of dying.
    const ed=$("editor"); ed.innerHTML="";
    ed.appendChild(h("div",{class:"empty"},[
      h("div",{class:"em-mark",text:"…"}),
      h("h2",{text:"Not available yet"}),
      h("p",{text:"The server did not serve "+entry.target+" ("+(errMsg||(j&&j.error))+"). It may be restarting — try again in a moment."}),
      h("button",{class:"btn", onclick:()=>selectDeckScreen(entry), text:"Retry"})
    ]));
    return;
  }
  WORK = j.data;
  SEL = { target: entry.target, kind: j.kind || "deck-screen" };

  if (entry.target === "deck:copy"){
    renderDeckCopyForm();
    setPreview(INTERACTIVE_PREVIEW, true, { view:"intro", menuOpen:false });
  } else if (entry.target.startsWith("deck:sysdata#")){
    const key = entry.target.split("#")[1];
    renderSysHubForm(key);
    setPreview(INTERACTIVE_PREVIEW, true, { view:key, sysKey:key, menuOpen:false });
  } else if (entry.target === "deck:workflows"){
    renderWorkflowsForm();
    setPreview(INTERACTIVE_PREVIEW, true, { view:"workflows", menuOpen:false });
  } else {
    // Unknown future deck screen — generic fallback.
    renderGenericObjectForm(WORK, entry.label);
    setPreview(INTERACTIVE_PREVIEW, true, null);
  }
}

const SLIDE_LAYOUTS=["title","section","bullets","callout","quote","split","table","content","footer"];
function openSlide(i, treeEl){
  RERENDER = ()=>openSlide(i);
  SEL.slideIndex=i;
  const s = WORK.slides[i];
  setHead("Generated Deck · "+(WORK.title||WORK.slug), "Slide "+(i+1)+" · "+(s.layout||"?"));
  const frag=document.createDocumentFragment();
  // layout selector
  const layoutSel=h("select",{class:"inp", onchange:(e)=>{ s.layout=e.target.value; }},
    SLIDE_LAYOUTS.concat(s.layout && !SLIDE_LAYOUTS.includes(s.layout)?[s.layout]:[]).map(l=>{
      const o=h("option",{value:l,text:l}); if(l===s.layout) o.setAttribute("selected",""); return o;
    }));
  frag.appendChild(section("Layout", [ h("div",{class:"field"},[ h("label",{text:"Slide layout"}), layoutSel ]) ]));

  // Render each field on the slide generically: string→text/textarea, string[]→list, else JSON textarea
  const scalarKids=[], listKids=[];
  Object.keys(s).forEach(k=>{
    if (k==="layout") return;
    const v=s[k];
    if (typeof v==="string" || typeof v==="number" || v==null){
      const long = k==="body"||k==="notes"||k==="quote"||k==="subtitle"||(typeof v==="string"&&v.length>60);
      scalarKids.push(textField(prettyKey(k), s, k, {textarea:long}));
    } else if (Array.isArray(v) && v.every(x=>typeof x==="string")){
      listKids.push(stringListField(prettyKey(k), v, {itemLabel:"Item"}));
    } else {
      // complex (e.g. table rows) — edit as JSON, parsed on blur
      const w=warnEl();
      const ta=h("textarea",{class:"inp", style:"min-height:120px; font-family:'DM Mono',monospace; font-size:12px",
        onchange:(e)=>{ try{ s[k]=JSON.parse(e.target.value); w.hidden=true; }catch(err){ w.hidden=false; w.style.color="var(--danger)"; w.textContent="⚠ Invalid JSON — not applied"; } }});
      ta.value=JSON.stringify(v,null,2);
      scalarKids.push(h("div",{class:"field"},[ h("label",{text:prettyKey(k)+" (JSON)"}), ta, w ]));
    }
  });
  frag.appendChild(section("Content", scalarKids.concat(listKids)));
  mountEditor(frag);
}
function prettyKey(k){ return k.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }

// ── Editor mount + head + preview ────────────────────────
function setHead(kicker, name){ $("phKicker").textContent=kicker; $("phName").textContent=name; renderActions(); }
function showLoading(){
  $("reviewPanel").innerHTML="";   // new selection → drop any pending AI Clean review
  const fa=$("formArea"); fa.innerHTML="";
  fa.appendChild(h("div",{class:"loading"},[h("span",{class:"spinner"}),document.createTextNode(" Loading content…")]));
}
function mountEditor(frag){
  renderActions();   // SEL is set by the time a form mounts — keep header actions in sync
  const ed=$("formArea"); ed.innerHTML="";
  ed.appendChild(frag);
  // save bar
  const status=h("div",{class:"save-status", id:"saveStatus"});
  const saveBtn=h("button",{class:"btn primary", id:"saveBtn", onclick:doSave, text:"Save"});
  ed.appendChild(h("div",{class:"savebar"},[ saveBtn, status ]));
  ed.appendChild(h("div",{class:"revert-hint", text:"Revert: the server keeps a one-level .bak of every file it writes — restore it from disk to undo a save."}));
}
function renderActions(){
  const box=$("phActions"); box.innerHTML="";
  if (!SEL) return;
  box.appendChild(h("button",{class:"btn", id:"aiCleanBtn", title:"Suggest brand-safe rewrites for this item's text", onclick:aiCleanCurrent, text:"✨ AI Clean"}));
  const tog=h("div",{class:"toggle"},[
    h("button",{id:"tgSplit",text:"Preview", onclick:()=>setSplit(true)}),
    h("button",{id:"tgFull",text:"Form only", onclick:()=>setSplit(false)}),
  ]);
  box.appendChild(tog);
  updateToggle();
}
let splitOn=true;
function setSplit(on){ splitOn=on; $("paneBody").classList.toggle("split", on && !!previewTarget); updateToggle(); }
function updateToggle(){
  const s=$("tgSplit"), f=$("tgFull"); if(!s) return;
  const on = splitOn && !!previewTarget;
  s.classList.toggle("on", on); f.classList.toggle("on", !on);
  s.disabled = !previewTarget;
}
function setPreview(url, forceOpen, dcState){
  previewTarget=url||null;
  previewDc = dcState || null;   // for the interactive deck: jump to the edited module
  if (forceOpen && url) splitOn=true;
  $("paneBody").classList.toggle("split", splitOn && !!url);
  updateToggle();
  if (url){ $("previewUrl").textContent=url; reloadPreview(); }
}
function reloadPreview(){
  if (!previewTarget) return;
  const f=$("previewFrame");
  const bust=(previewTarget.includes("?")?"&":"?")+"_ts="+Date.now();
  // Jump the bundled deck to the module being edited once its sync bridge is up.
  // The server injects deck-bridge.js into TMSDeck-dev.html; it applies
  // {fp:'dcApply', payload:{kind:'state', state}} messages. The bridge mounts a
  // beat after load, so retry a few times.
  f.onload = () => {
    if (!previewDc) return;
    const msg = { fp:'dcApply', payload:{ kind:'state', state: previewDc } };
    [300, 800, 1500, 2400, 3500].forEach(t => setTimeout(() => {
      try { f.contentWindow && f.contentWindow.postMessage(msg, '*'); } catch(e){}
    }, t));
  };
  f.src=previewTarget+bust;
}
$("previewReload").addEventListener("click", reloadPreview);

// ── Save ─────────────────────────────────────────────────
async function doSave(){
  if (saving || !SEL) return;
  saving=true;
  const btn=$("saveBtn"), status=$("saveStatus");
  // feat:* and deck:* targets trigger a full interactive-deck rebundle on the server.
  const isRebuild = SEL.kind==="feature-set" || SEL.target.indexOf("deck:")===0;
  btn.disabled=true;
  status.innerHTML="";
  status.appendChild(h("span",{class:"spinner"}));
  status.appendChild(document.createTextNode(isRebuild ? " Saving & rebuilding the deck…" : " Saving…"));
  try{
    const r=await fetch("/api/content",{method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ target:SEL.target, data:WORK })});
    const j=await r.json();
    if (!r.ok || j.ok===false){
      throw new Error(j.error || j.rebundleLog || ("HTTP "+r.status));
    }
    let msg="Saved";
    if (j.rebundled) msg+=" · deck rebuilt";
    else if (isRebuild && CATALOG.canRebundle) msg+=" · rebuild skipped";
    toast(msg, false);
    status.textContent="";
    reloadPreview();
  }catch(e){
    toast("Save failed: "+(e.message||e), true);
    status.textContent="Save failed.";
  }finally{
    saving=false; btn.disabled=false;
  }
}

// ═════════════════════════════════════════════════════════
//  AI Clean — per-item review + whole-deck sweep
// ═════════════════════════════════════════════════════════

// Keys that are structural / non-copy — never sent to AI Clean.
const CLEAN_SKIP_KEYS = new Set([
  "num","slug","abbr","url","link","file","embed","progress","created","fmt",
  "min","max","step","value","dc","slide","video","layout","overlays","ring",
  "key","id","FP_SHOT_ORDER"
]);
// Flatten every editable text field of a data node into { "dotted.key": text }.
function flattenText(node, prefix, out){
  if (typeof node === "string"){ if (node.trim()) out[prefix] = node; return; }
  if (Array.isArray(node)){ node.forEach((v,i)=>flattenText(v, prefix ? prefix+"."+i : String(i), out)); return; }
  if (node && typeof node === "object"){
    for (const k of Object.keys(node)){
      if (CLEAN_SKIP_KEYS.has(k)) continue;
      flattenText(node[k], prefix ? prefix+"."+k : k, out);
    }
  }
}
function setByPath(root, dotted, val){
  const parts = dotted.split(".");
  let n = root;
  for (let i=0; i<parts.length-1; i++){
    const p = Array.isArray(n) ? Number(parts[i]) : parts[i];
    n = n[p];
    if (n == null) return false;
  }
  const last = Array.isArray(n) ? Number(parts[parts.length-1]) : parts[parts.length-1];
  n[last] = val;
  return true;
}
function getByPath(root, dotted){
  let n = root;
  for (const p of dotted.split(".")){
    if (n == null) return undefined;
    n = n[Array.isArray(n) ? Number(p) : p];
  }
  return n;
}
function cleanKindForSel(){
  if (!SEL) return null;
  if (SEL.kind === "feature-set") return "module";
  if (SEL.target.indexOf("deck:") === 0) return "copy";
  if (SEL.kind === "generated-deck") return "slide";
  return "page";
}
function cleanRootForSel(){
  if (!SEL) return null;
  if (SEL.kind === "feature-set") return CURRENT_MODULE;
  if (SEL.kind === "generated-deck" && SEL.slideIndex != null) return WORK.slides[SEL.slideIndex];
  return WORK;
}
async function postAiClean(kind, label, fields){
  const r = await fetch("/api/ai-clean", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ kind, label, fields }) });
  const j = await r.json().catch(()=>({error:"bad response"}));
  if (!r.ok || j.error) {
    const msg = j.error || ("HTTP "+r.status);
    const friendly = /unreach|unavail/i.test(msg) ? "AI Clean needs internet + the FreightPOP AI service" : msg;
    const e = new Error(friendly); e.raw = msg; throw e;
  }
  return j.fields || {};
}

// ── Per-item AI Clean ────────────────────────────────────
async function aiCleanCurrent(){
  const btn = $("aiCleanBtn");
  if (!SEL || !btn || btn.disabled) return;
  const root = cleanRootForSel();
  if (!root){ toast("Nothing to clean here", true); return; }
  const fields = {};
  flattenText(root, "", fields);
  if (!Object.keys(fields).length){ toast("No text fields on this item", false); return; }
  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = "✨ Cleaning…";
  try{
    const res = await postAiClean(cleanKindForSel(), $("phName").textContent, fields);
    const items = [];
    Object.keys(res).forEach(k=>{
      const f = res[k];
      if (f && f.changed) items.push({ key:k, old:fields[k], cleaned:f.cleaned, note:f.note });
    });
    if (!items.length){ toast("Already clean ✓", false); return; }
    renderItemReview(root, items);
  }catch(e){
    toast("AI Clean failed: "+(e.message||e), true);
  }finally{
    btn.disabled = false; btn.textContent = oldText;
  }
}
function makeReviewCard(item, onAccept, onReject){
  const state = h("div",{class:"rv-state"});
  const card = h("div",{class:"rv-card"},[
    h("div",{class:"rv-key",text:item.key}),
    h("div",{class:"rv-old",text:item.old}),
    h("div",{class:"rv-new",text:item.cleaned}),
    item.note ? h("div",{class:"rv-note",text:item.note}) : null,
    state,
    h("div",{class:"rv-actions"},[
      h("button",{class:"btn primary", onclick:()=>card._accept(), text:"Accept"}),
      h("button",{class:"btn", onclick:()=>card._reject(), text:"Reject"}),
    ]),
  ]);
  card._done = false;
  card._accept = ()=>{ if(card._done) return; card._done=true; card.classList.add("accepted"); state.textContent="Accepted ✓"; onAccept(item); };
  card._reject = ()=>{ if(card._done) return; card._done=true; card.classList.add("rejected"); onReject && onReject(item); };
  return card;
}
function renderItemReview(root, items){
  const panel = $("reviewPanel"); panel.innerHTML = "";
  const cards = items.map(it => makeReviewCard(it, (item)=>{
    setByPath(root, item.key, item.cleaned);
    if (RERENDER) RERENDER();       // reflect the accepted text in the live form
  }));
  const wrap = h("div",{class:"review-wrap"},[
    h("div",{class:"rv-head"},[
      h("div",{class:"rv-title",text:"✨ AI Clean review · "+items.length+" suggested edit"+(items.length===1?"":"s")}),
      h("button",{class:"btn ghost", onclick:()=>cards.forEach(c=>c._accept()), text:"Accept all"}),
      h("button",{class:"btn ghost", onclick:()=>cards.forEach(c=>c._reject()), text:"Reject all"}),
      h("button",{class:"icobtn", title:"Close review", onclick:()=>{panel.innerHTML="";}, text:"✕"}),
    ]),
    h("div",{class:"hint", style:"margin-bottom:12px", text:"Accepting fills the form below — review, then press Save as usual. Nothing is saved automatically."}),
    ...cards,
  ]);
  panel.appendChild(wrap);
  panel.scrollIntoView({behavior:"smooth", block:"start"});
}

// ── Whole-deck sweep ─────────────────────────────────────
function confirmModal(title, bodyText, okLabel){
  return new Promise((resolve)=>{
    let back;
    const done=(v)=>{ back.remove(); document.removeEventListener("keydown", esc); resolve(v); };
    const esc=(e)=>{ if(e.key==="Escape") done(false); };
    const cancelBtn = h("button",{class:"btn primary", onclick:()=>done(false), text:"Cancel"});
    back = h("div",{class:"modal-back", onclick:(e)=>{ if(e.target===back) done(false); }},[
      h("div",{class:"modal"},[
        h("h3",{text:title}),
        h("p",{text:bodyText}),
        h("div",{class:"m-actions"},[
          h("button",{class:"btn", onclick:()=>done(true), text:okLabel}),
          cancelBtn,
        ]),
      ]),
    ]);
    document.body.appendChild(back);
    document.addEventListener("keydown", esc);
    cancelBtn.focus();   // Cancel is the default
  });
}
async function fetchContent(target){
  const r = await fetch("/api/content?target="+encodeURIComponent(target));
  if (!r.ok) throw new Error("HTTP "+r.status+" for "+target);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.data;
}
$("sweepBtn").addEventListener("click", startSweep);
async function startSweep(){
  if (!CATALOG) return;
  const nMods = (CATALOG.interactive||[]).reduce((a,s)=>a+(s.modules||[]).length, 0);
  const nDs = (CATALOG.deckScreens||[]).length;
  const nPg = (CATALOG.pages||[]).length;
  const total = nMods + nDs + nPg;
  const ok = await confirmModal("Clean the whole deck?",
    "Runs AI Clean over every module ("+nMods+"), deck screen ("+nDs+"), and page ("+nPg+") — ~"+total+
    " AI calls, roughly a dollar or two, a few minutes. Nothing is saved until you review and accept the results. Proceed?",
    "Run AI Clean");
  if (!ok) return;
  runSweep(total);
}
async function runSweep(total){
  sweepAbort = false;
  SEL = null; previewTarget = null; previewDc = null;
  setHead("Deck sweep", "✨ AI Clean — whole deck");
  setPreview(null, false);
  $("reviewPanel").innerHTML = "";
  const fa = $("formArea"); fa.innerHTML = "";
  const bar = h("i");
  const line = h("div",{class:"prog-line",text:"Starting…"});
  const log = h("div",{class:"sweep-log"});
  const abortBtn = h("button",{class:"btn", onclick:()=>{ sweepAbort=true; abortBtn.disabled=true; abortBtn.textContent="Stopping…"; }, text:"Abort"});
  fa.appendChild(section("Cleaning every module, deck screen and page", [
    h("div",{class:"prog"},[bar]), line, h("div",{style:"margin-top:12px"},[abortBtn]), log
  ]));

  // fetched data copies (per POST target) + accumulated suggestions
  const fetched = new Map();     // target -> data (the exact shape to POST back)
  const groups = [];             // { label, target, moduleIndex?, items:[{key,old,cleaned,note,accepted}] }
  let done = 0;
  const tick = (label)=>{ done++; bar.style.width = Math.round(done/total*100)+"%"; line.textContent = done+" / "+total+" · "+label; };
  const fail = (label, e)=>{ log.appendChild(h("div",{class:"bad",text:"✕ "+label+" — "+(e.message||e)})); };
  const noteOk = (label, n)=>{ if(n) log.appendChild(h("div",{text:"✓ "+label+" — "+n+" suggestion"+(n===1?"":"s")})); };

  async function cleanOne(kind, label, rootObj, target, moduleIndex){
    const fields = {};
    flattenText(rootObj, "", fields);
    if (!Object.keys(fields).length) return;
    const res = await postAiClean(kind, label, fields);
    const items = [];
    Object.keys(res).forEach(k=>{ const f=res[k]; if (f && f.changed) items.push({key:k, old:fields[k], cleaned:f.cleaned, note:f.note, accepted:null}); });
    if (items.length) groups.push({ label, target, moduleIndex, items });
    noteOk(label, items.length);
  }

  outer:
  {
    // 1. every module of every interactive system
    for (const sys of (CATALOG.interactive||[])){
      if (sweepAbort) break outer;
      let data;
      try{ data = await fetchContent(sys.target); fetched.set(sys.target, data); }
      catch(e){ fail(sys.label, e); (sys.modules||[]).forEach(()=>tick(sys.label+" (skipped)")); continue; }
      for (let i=0; i<data.length; i++){
        if (sweepAbort) break outer;
        const m = data[i];
        const label = sys.sys.toUpperCase()+" "+(m.num||String(i+1))+" "+(m.name||"");
        tick(label+"…");
        try{ await cleanOne("module", label, m, sys.target, i); }
        catch(e){ fail(label, e); }
      }
    }
    // 2. deck screens
    for (const ds of (CATALOG.deckScreens||[])){
      if (sweepAbort) break outer;
      tick(ds.label+"…");
      try{
        const data = await fetchContent(ds.target); fetched.set(ds.target, data);
        await cleanOne("copy", ds.label, data, ds.target);
      }catch(e){ fail(ds.label, e); }
    }
    // 3. pages
    for (const p of (CATALOG.pages||[])){
      if (sweepAbort) break outer;
      tick(p.label+"…");
      try{
        const data = await fetchContent(p.target); fetched.set(p.target, data);
        await cleanOne("page", p.label, data, p.target);
      }catch(e){ fail(p.label, e); }
    }
  }
  renderSweepReview(fetched, groups, sweepAbort);
}
function renderSweepReview(fetched, groups, aborted){
  setHead("Deck sweep", aborted ? "AI Clean — stopped early" : "✨ AI Clean — review");
  const fa=$("formArea"); fa.innerHTML="";
  const totalItems = groups.reduce((a,g)=>a+g.items.length, 0);
  if (!totalItems){
    fa.appendChild(h("div",{class:"empty"},[
      h("div",{class:"em-mark",text:"✓"}),
      h("h2",{text: aborted ? "Stopped — no changes collected" : "Everything is already clean"}),
      h("p",{text:"AI Clean found nothing to improve"+(aborted?" before the sweep was stopped.":" across the deck.")}),
    ]));
    return;
  }
  const frag=document.createDocumentFragment();
  frag.appendChild(h("div",{class:"hint", style:"margin-bottom:16px",
    text:(aborted?"Sweep stopped early — showing what was collected. ":"")+
      totalItems+" suggested edits across "+groups.length+" items. Accept what you want, then press “Save accepted changes” — each affected deck/page is saved once."}));
  const allCards=[];
  groups.forEach(g=>{
    const cards = g.items.map(it => makeReviewCard(it, (item)=>{ item.accepted=true; }, (item)=>{ item.accepted=false; }));
    allCards.push(...cards);
    frag.appendChild(h("div",{class:"rv-group-title"},[
      document.createTextNode(g.label),
      h("button",{class:"btn ghost", onclick:()=>cards.forEach(c=>c._accept()), text:"Accept all"}),
    ]));
    cards.forEach(c=>frag.appendChild(c));
  });
  const saveStatus=h("div",{class:"save-status"});
  const saveBtn=h("button",{class:"btn primary", text:"Save accepted changes",
    onclick:()=>saveSweepAccepted(fetched, groups, saveBtn, saveStatus)});
  frag.appendChild(h("div",{class:"savebar"},[
    saveBtn,
    h("button",{class:"btn", onclick:()=>allCards.forEach(c=>c._accept()), text:"Accept all"}),
    h("button",{class:"btn", onclick:()=>allCards.forEach(c=>c._reject()), text:"Reject all"}),
    saveStatus
  ]));
  fa.appendChild(frag);
}
async function saveSweepAccepted(fetched, groups, btn, status){
  const accepted = groups.map(g=>({...g, items:g.items.filter(i=>i.accepted===true)})).filter(g=>g.items.length);
  if (!accepted.length){ toast("Nothing accepted yet", true); return; }
  btn.disabled = true;
  // apply accepted values into the fetched copies
  const targets = new Set();
  for (const g of accepted){
    const data = fetched.get(g.target);
    if (!data){ continue; }
    const root = (g.moduleIndex != null) ? data[g.moduleIndex] : data;
    g.items.forEach(it=>setByPath(root, it.key, it.cleaned));
    targets.add(g.target);
  }
  let okN=0, failN=0;
  for (const target of targets){
    const isRebuild = target.indexOf("feat:")===0 || target.indexOf("deck:")===0;
    status.innerHTML="";
    status.appendChild(h("span",{class:"spinner"}));
    status.appendChild(document.createTextNode(" Saving "+target+(isRebuild?" — rebuilding deck…":"…")));
    try{
      const r=await fetch("/api/content",{method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ target, data: fetched.get(target) })});
      const j=await r.json();
      if (!r.ok || j.ok===false) throw new Error(j.error||j.rebundleLog||("HTTP "+r.status));
      okN++;
    }catch(e){ failN++; toast("Save failed for "+target+": "+(e.message||e), true); }
  }
  status.textContent = okN+" target"+(okN===1?"":"s")+" saved"+(failN?(" · "+failN+" failed"):"");
  toast(failN ? "Saved with errors — see status" : "Accepted changes saved ✓", !!failN);
  btn.disabled = false;
}

// ── Hash deep-link (#feat:tms#11, #page:roi-value, #deck:copy, #gen:slug) ──
function applyHashSelection(){
  const raw = location.hash;
  if (!raw || raw.length < 2) return;
  let key;
  try{ key = decodeURIComponent(raw.slice(1)); }catch(e){ return; }
  const el = document.querySelector('.tree-item[data-key="'+CSS.escape(key)+'"]');
  if (!el) return;   // unknown hash → ignore
  if (el.classList.contains("child")){
    const kids = el.parentElement;
    if (kids && kids.classList.contains("tree-children")){
      kids.classList.add("open");
      const parentBtn = kids.previousElementSibling;
      if (parentBtn && parentBtn.classList.contains("tree-item")) parentBtn.classList.add("open");
    }
  }
  el.click();
}
window.addEventListener("hashchange", applyHashSelection);

// ── Boot ─────────────────────────────────────────────────
loadCatalog().then(applyHashSelection).catch(e=>{
  $("tree").innerHTML="";
  $("tree").appendChild(h("div",{class:"loading", style:"color:var(--danger)", text:"Failed to load catalog: "+(e.message||e)}));
});
</script>
