  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   FreightPOP — Color tokens\n   Primitives → semantic aliases. Source of truth for the palette.\n   ============================================================ */\n:root {\n  /* ---- Core brand primitives ---- */\n  --fp-navy:          #051729;  /* primary brand — dark surfaces, nav, body text on light */\n  --fp-blue:          #4088CF;  /* brand blue — headlines, accents, data viz 1 */\n  --fp-mint-deep:     #0F7B6C;  /* primary action on light — buttons, links, focus */\n  --fp-mint-bright:   #3DD6B5;  /* action on dark — CTAs, highlights (9.9:1 on navy) */\n  --fp-white:         #FFFFFF;\n\n  /* ---- Extended palette (data viz + supporting) ---- */\n  --fp-sky-teal:      #3AADBC;\n  --fp-deep-navy:     #0A3D6B;\n  --fp-sage:          #4CAF85;\n  --fp-slate:         #7A96B0;\n\n  /* ---- Feedback ---- */\n  --fp-success:       #2E7D32;\n  --fp-warning:       #F59E0B;\n  --fp-error:         #D32F2F;\n  --fp-info:          #1565C0;\n  --fp-success-bg:    #E8F5E9;\n  --fp-warning-bg:    #FFF8E1;\n  --fp-error-bg:      #FFEBEE;\n  --fp-info-bg:       #E3F0FB;\n\n  /* ============================================================\n     Semantic aliases — reference these in product code\n     ============================================================ */\n  /* Surfaces */\n  --surface-page:        #FFFFFF;\n  --surface-subtle:      #F4F7FB;  /* section fills, zebra rows, input bg */\n  --surface-card:        #E8EFF7;  /* card fills on white */\n  --surface-dark:        #051729;  /* hero/dark sections */\n  --surface-dark-raised: #0A2540;  /* cards/panels on dark */\n\n  /* Text — on light */\n  --text-primary:        #051729;\n  --text-secondary:      #3D5670;\n  --text-muted:          #7A96B0;\n  /* Text — on dark */\n  --text-on-dark:        #FFFFFF;\n  --text-secondary-on-dark: #B5CDE0;\n  --text-muted-on-dark:  #7A96B0;\n  --text-accent-on-dark: #3DD6B5;\n\n  /* Actions */\n  --action-primary:        #0F7B6C;\n  --action-primary-hover:  #0A5C51;\n  --action-primary-active: #073D36;\n  --action-primary-disabled: #A8CCC8;\n  --action-on-dark:        #3DD6B5;\n  --action-on-dark-hover:  #2EB89A;\n  --action-on-dark-active: #239B80;\n  --link:                  #0F7B6C;\n\n  /* Borders */\n  --border-default:   #D0DCE8;  /* card outlines, inputs, dividers */\n  --border-emphasis:  #7A96B0;  /* hover borders, selected rows */\n  --border-focus:     #0F7B6C;  /* keyboard focus rings */\n  --border-accent:    #4088CF;  /* selected/active tab, highlighted card */\n  --focus-ring:       rgba(15,123,108,0.12);\n\n  /* Data viz — 6-color categorical */\n  --chart-1: #4088CF;\n  --chart-2: #0F7B6C;\n  --chart-3: #3AADBC;\n  --chart-4: #0A3D6B;\n  --chart-5: #4CAF85;\n  --chart-6: #7A96B0;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   FreightPOP — Typography tokens\n   Headings: Manrope (400 large / 500 small). Body & UI: DM Sans.\n   Code, labels, numeric/tabular: DM Mono.\n   ============================================================ */\n:root {\n  /* Families */\n  --font-display: 'Manrope', system-ui, sans-serif;   /* headings, stats, nav logo */\n  --font-body:    'DM Sans', system-ui, sans-serif;    /* body, UI, buttons, forms */\n  --font-mono:    'DM Mono', ui-monospace, monospace;  /* code, tokens, overlines */\n\n  /* Type scale — sizes */\n  --text-display: 56px;  /* hero display */\n  --text-h1:      40px;\n  --text-h2:      32px;\n  --text-h3:      24px;\n  --text-h4:      18px;\n  --text-body-lg: 18px;\n  --text-body:    15px;  /* default body */\n  --text-body-sm: 13px;\n  --text-caption: 12px;\n  --text-label:   12px;\n  --text-overline:11px;\n\n  /* Weights */\n  --weight-light:   300;\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold:600;\n  --weight-bold:    700;\n\n  /* Line heights */\n  --leading-tight: 1.05;  /* display / h1 */\n  --leading-heading: 1.1; /* h2 / h3 */\n  --leading-snug:  1.2;   /* h4 */\n  --leading-body:  1.5;   /* body copy */\n  --leading-label: 1.0;\n\n  /* Letter spacing */\n  --tracking-tight:  -0.02em;  /* display, h1, h2 large */\n  --tracking-snug:   -0.01em;  /* h3, h4 */\n  --tracking-normal: 0;\n  --tracking-wide:   0.08em;   /* overline */\n  --tracking-wider:  0.12em;   /* eyebrow / mono caps */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   FreightPOP — Spacing, radius, shadow tokens\n   Base-4 spacing. Default card radius 12px. Shadows keyed to\n   brand navy rgba(5,23,41,…), not pure black. Dual-layer.\n   ============================================================ */\n:root {\n  /* Spacing — base-4 */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  /* Radius */\n  --radius-none: 0px;\n  --radius-xs:   4px;   /* tags, badges, code */\n  --radius-sm:   6px;   /* buttons, inputs, chips */\n  --radius-md:   8px;   /* icon containers, tooltips */\n  --radius-lg:   12px;  /* cards, panels, modals — DEFAULT */\n  --radius-xl:   16px;  /* feature cards, hero sections */\n  --radius-2xl:  24px;  /* marketing callout blocks */\n  --radius-full: 9999px;\n\n  /* Shadow elevation — navy-keyed, dual-layer */\n  --shadow-none: none;\n  --shadow-xs: 0 1px 2px rgba(5,23,41,0.05);\n  --shadow-sm: 0 1px 4px rgba(5,23,41,0.07), 0 1px 2px rgba(5,23,41,0.04);\n  --shadow-md: 0 4px 12px rgba(5,23,41,0.08), 0 1px 4px rgba(5,23,41,0.04);\n  --shadow-lg: 0 8px 24px rgba(5,23,41,0.10), 0 2px 6px rgba(5,23,41,0.05);\n  --shadow-xl: 0 16px 40px rgba(5,23,41,0.12), 0 4px 10px rgba(5,23,41,0.06);\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 0.15s; /* @kind other */\n  --duration-base: 0.2s; /* @kind other * +0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   FreightPOP — Color tokens\n   Primitives → semantic aliases. Source of truth for the palette.\n   ============================================================ */\n:root {\n  /* ---- Core brand primitives ---- */\n  --fp-navy:          #051729;  /* primary brand — dark surfaces, nav, body text on light */\n  --fp-blue:          #4088CF;  /* brand blue — headlines, accents, data viz 1 */\n  --fp-mint-deep:     #0F7B6C;  /* primary action on light — buttons, links, focus */\n  --fp-mint-bright:   #3DD6B5;  /* action on dark — CTAs, highlights (9.9:1 on navy) */\n  --fp-white:         #FFFFFF;\n\n  /* ---- Extended palette (data viz + supporting) ---- */\n  --fp-sky-teal:      #3AADBC;\n  --fp-deep-navy:     #0A3D6B;\n  --fp-sage:          #4CAF85;\n  --fp-slate:         #7A96B0;\n\n  /* ---- Feedback ---- */\n  --fp-success:       #2E7D32;\n  --fp-warning:       #F59E0B;\n  --fp-error:         #D32F2F;\n  --fp-info:          #1565C0;\n  --fp-success-bg:    #E8F5E9;\n  --fp-warning-bg:    #FFF8E1;\n  --fp-error-bg:      #FFEBEE;\n  --fp-info-bg:       #E3F0FB;\n\n  /* ============================================================\n     Semantic aliases — reference these in product code\n     ============================================================ */\n  /* Surfaces */\n  --surface-page:        #FFFFFF;\n  --surface-subtle:      #F4F7FB;  /* section fills, zebra rows, input bg */\n  --surface-card:        #E8EFF7;  /* card fills on white */\n  --surface-dark:        #051729;  /* hero/dark sections */\n  --surface-dark-raised: #0A2540;  /* cards/panels on dark */\n\n  /* Text — on light */\n  --text-primary:        #051729;\n  --text-secondary:      #3D5670;\n  --text-muted:          #7A96B0;\n  /* Text — on dark */\n  --text-on-dark:        #FFFFFF;\n  --text-secondary-on-dark: #B5CDE0;\n  --text-muted-on-dark:  #7A96B0;\n  --text-accent-on-dark: #3DD6B5;\n\n  /* Actions */\n  --action-primary:        #0F7B6C;\n  --action-primary-hover:  #0A5C51;\n  --action-primary-active: #073D36;\n  --action-primary-disabled: #A8CCC8;\n  --action-on-dark:        #3DD6B5;\n  --action-on-dark-hover:  #2EB89A;\n  --action-on-dark-active: #239B80;\n  --link:                  #0F7B6C;\n\n  /* Borders */\n  --border-default:   #D0DCE8;  /* card outlines, inputs, dividers */\n  --border-emphasis:  #7A96B0;  /* hover borders, selected rows */\n  --border-focus:     #0F7B6C;  /* keyboard focus rings */\n  --border-accent:    #4088CF;  /* selected/active tab, highlighted card */\n  --focus-ring:       rgba(15,123,108,0.12);\n\n  /* Data viz — 6-color categorical */\n  --chart-1: #4088CF;\n  --chart-2: #0F7B6C;\n  --chart-3: #3AADBC;\n  --chart-4: #0A3D6B;\n  --chart-5: #4CAF85;\n  --chart-6: #7A96B0;\n}\n\n/* ============================================================\n   FreightPOP — Typography tokens\n   Headings: Manrope (400 large / 500 small). Body & UI: DM Sans.\n   Code, labels, numeric/tabular: DM Mono.\n   ============================================================ */\n:root {\n  /* Families */\n  --font-display: 'Manrope', system-ui, sans-serif;   /* headings, stats, nav logo */\n  --font-body:    'DM Sans', system-ui, sans-serif;    /* body, UI, buttons, forms */\n  --font-mono:    'DM Mono', ui-monospace, monospace;  /* code, tokens, overlines */\n\n  /* Type scale — sizes */\n  --text-display: 56px;  /* hero display */\n  --text-h1:      40px;\n  --text-h2:      32px;\n  --text-h3:      24px;\n  --text-h4:      18px;\n  --text-body-lg: 18px;\n  --text-body:    15px;  /* default body */\n  --text-body-sm: 13px;\n  --text-caption: 12px;\n  --text-label:   12px;\n  --text-overline:11px;\n\n  /* Weights */\n  --weight-light:   300;\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold:600;\n  --weight-bold:    700;\n\n  /* Line heights */\n  --leading-tight: 1.05;  /* display / h1 */\n  --leading-heading: 1.1; /* h2 / h3 */\n  --leading-snug:  1.2;   /* h4 */\n  --leading-body:  1.5;   /* body copy */\n  --leading-label: 1.0;\n\n  /* Letter spacing */\n  --tracking-tight:  -0.02em;  /* display, h1, h2 large */\n  --tracking-snug:   -0.01em;  /* h3, h4 */\n  --tracking-normal: 0;\n  --tracking-wide:   0.08em;   /* overline */\n  --tracking-wider:  0.12em;   /* eyebrow / mono caps */\n}\n\n/* ============================================================\n   FreightPOP — Spacing, radius, shadow tokens\n   Base-4 spacing. Default card radius 12px. Shadows keyed to\n   brand navy rgba(5,23,41,…), not pure black. Dual-layer.\n   ============================================================ */\n:root {\n  /* Spacing — base-4 */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  /* Radius */\n  --radius-none: 0px;\n  --radius-xs:   4px;   /* tags, badges, code */\n  --radius-sm:   6px;   /* buttons, inputs, chips */\n  --radius-md:   8px;   /* icon containers, tooltips */\n  --radius-lg:   12px;  /* cards, panels, modals — DEFAULT */\n  --radius-xl:   16px;  /* feature cards, hero sections */\n  --radius-2xl:  24px;  /* marketing callout blocks */\n  --radius-full: 9999px;\n\n  /* Shadow elevation — navy-keyed, dual-layer */\n  --shadow-none: none;\n  --shadow-xs: 0 1px 2px rgba(5,23,41,0.05);\n  --shadow-sm: 0 1px 4px rgba(5,23,41,0.07), 0 1px 2px rgba(5,23,41,0.04);\n  --shadow-md: 0 4px 12px rgba(5,23,41,0.08), 0 1px 4px rgba(5,23,41,0.04);\n  --shadow-lg: 0 8px 24px rgba(5,23,41,0.10), 0 2px 6px rgba(5,23,41,0.05);\n  --shadow-xl: 0 16px 40px rgba(5,23,41,0.12), 0 4px 10px rgba(5,23,41,0.06);\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 0.15s; /* @kind other */\n  --duration-base: 0.2s; /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"315cdf46-6836-46e2-ae9b-730d31e088de\"><\u002Fscript>\n  <style>\n    a { color: #0F7B6C; text-decoration: none; }\n    a:hover { color: #0A5C51; }\n    doc-page:not(:defined) { visibility: hidden; }\n  <\u002Fstyle>\n  <script src=\"c9e6b4da-fc3a-4557-87fd-5152f503f65f\"><\u002Fscript>\n  <script src=\"a4c9b5f0-6075-41d2-bb41-437cab7d6daf\"><\u002Fscript>\n  \n<\u002Fhelmet>\n<doc-page margin=\"0\">\n\n  <section class=\"page\" data-screen-label=\"01 Cover\" style=\"display: flex; flex-direction: column; height: 11in; max-height: 11in; overflow: hidden; font-family: 'DM Sans', sans-serif; color: #FFFFFF; background: radial-gradient(70% 90% at 0% 0%, rgba(61,214,181,0.16) 0%, rgba(61,214,181,0) 60%), linear-gradient(to right, rgba(181,205,224,0.07) 1px, transparent 1px) 0 0 / 48px 48px, linear-gradient(to bottom, rgba(181,205,224,0.07) 1px, transparent 1px) 0 0 / 48px 48px, #051729;\">\n    <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 54px 56px 34px;\">\n      <header style=\"display: flex; align-items: center; justify-content: space-between;\">\n        <img src=\"df8880f2-85b6-4c79-9c84-724bf69de9f8\" alt=\"FreightPOP\" style=\"height: 28px; width: auto; display: block;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #3DD6B5;\">Case Study<\u002Fdiv>\n      <\u002Fheader>\n      <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #B5CDE0;\">Agriculture &nbsp;·&nbsp; Perishable Freight<\u002Fdiv>\n          <h1 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 400; font-size: 66px; line-height: 1.0; letter-spacing: -0.03em; max-width: 620px; text-wrap: pretty;\">Global Citrus <span style=\"color: #3DD6B5;\">Cooperative<\u002Fspan><\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"width: 64px; height: 2px; background: #3DD6B5;\"><\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.62; color: #C8DAE9; max-width: 580px; text-wrap: pretty;\">As one of the world’s largest citrus cooperatives, this organization faced significant challenges in managing complex shipping operations across domestic and international markets. From manual shipping processes and limited visibility to high shipping costs and system integration issues, these obstacles were impacting their supply chain efficiency and increasing overall costs. Seeking a solution to streamline operations, reduce expenses, and enhance shipment visibility, they partnered with FreightPOP to overcome these hurdles and optimize their logistics strategy.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex-shrink: 0; height: 340px; position: relative;\">\n      <image-slot id=\"citrus-cover\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop the cover photo (crated citrus)\" src=\"8bf717a0-012c-4dd5-b5ba-1e0cc44c94d8\"><\u002Fimage-slot>\n      <div style=\"position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, #051729 0%, rgba(5,23,41,0.55) 22%, rgba(5,23,41,0.05) 60%, rgba(5,23,41,0.35) 100%);\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"02 About\" style=\"display: flex; flex-direction: column; height: 11in; max-height: 11in; overflow: hidden; font-family: 'DM Sans', sans-serif; color: #051729; background: linear-gradient(to right, rgba(5,23,41,0.04) 1px, transparent 1px) 0 0 / 48px 48px, linear-gradient(to bottom, rgba(5,23,41,0.04) 1px, transparent 1px) 0 0 / 48px 48px, #FFFFFF;\">\n    <div style=\"flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 34px 56px 0;\">\n      <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #3D5670;\">Citrus Co-Op &nbsp;×&nbsp; FreightPOP<\u002Fdiv>\n      <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #7A93AC;\">02 / 05<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 34px; padding: 46px 56px 40px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #0F7B6C;\">About<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 400; font-size: 46px; line-height: 1.05; letter-spacing: -0.025em; max-width: 620px; text-wrap: pretty;\">About<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 34px;\">\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #3D5670; text-wrap: pretty;\">This leading agricultural cooperative, with over a century of history, represents thousands of citrus growers across California and Arizona.<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #3D5670; text-wrap: pretty;\">Committed to quality and sustainability, the organization blends traditional farming practices with modern innovations to deliver fresh, premium citrus products worldwide.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #7A93AC;\">Committed to sustainability<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;\">\n          <div style=\"border: 1px solid #E2EAF3; border-radius: 16px; background: linear-gradient(135deg, #F1F6FB 0%, #FFFFFF 42%, #FFFFFF 68%, #F0F8F6 100%); box-shadow: 0 1px 2px rgba(5,23,41,0.04), 0 4px 14px rgba(5,23,41,0.05); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #0F7B6C;\">01<\u002Fspan>\n            <div style=\"font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; letter-spacing: -0.01em;\">Protecting resources<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid #E2EAF3; border-radius: 16px; background: linear-gradient(135deg, #F1F6FB 0%, #FFFFFF 42%, #FFFFFF 68%, #F0F8F6 100%); box-shadow: 0 1px 2px rgba(5,23,41,0.04), 0 4px 14px rgba(5,23,41,0.05); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #0F7B6C;\">02<\u002Fspan>\n            <div style=\"font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; letter-spacing: -0.01em;\">Reducing waste<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid #E2EAF3; border-radius: 16px; background: linear-gradient(135deg, #F1F6FB 0%, #FFFFFF 42%, #FFFFFF 68%, #F0F8F6 100%); box-shadow: 0 1px 2px rgba(5,23,41,0.04), 0 4px 14px rgba(5,23,41,0.05); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #0F7B6C;\">03<\u002Fspan>\n            <div style=\"font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; letter-spacing: -0.01em;\">Promoting eco-friendly farming<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #3D5670; max-width: 660px; text-wrap: pretty;\">As a cooperative, the company supports its growers and communities by prioritizing sustainability—protecting resources, reducing waste, and promoting eco-friendly farming. Embracing innovation, they use advanced technology to ensure fresh, high-quality products that meet global demands, making it a trusted brand across the globe.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex-shrink: 0; height: 8px; background: linear-gradient(to right, #3DD6B5 0%, rgba(61,214,181,0) 42%);\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"03 Challenges &amp; Solutions\" style=\"display: flex; flex-direction: column; height: 11in; max-height: 11in; overflow: hidden; font-family: 'DM Sans', sans-serif; color: #051729; background: linear-gradient(to right, rgba(5,23,41,0.04) 1px, transparent 1px) 0 0 / 48px 48px, linear-gradient(to bottom, rgba(5,23,41,0.04) 1px, transparent 1px) 0 0 / 48px 48px, #FFFFFF;\">\n    <div style=\"flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 34px 56px 0;\">\n      <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #3D5670;\">Citrus Co-Op &nbsp;×&nbsp; FreightPOP<\u002Fdiv>\n      <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #7A93AC;\">03 / 05<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; padding: 38px 56px 36px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #0F7B6C;\">Challenges &amp; Solutions<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 400; font-size: 38px; line-height: 1.05; letter-spacing: -0.025em; max-width: 620px; text-wrap: pretty;\">The Challenges &amp; FreightPOP Solutions<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #D32F2F;\">Before<\u002Fdiv>\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #0F7B6C; padding-left: 40px;\">With FreightPOP<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(5, 1fr); gap: 0; border-bottom: 1px solid #D0DCE8; margin-top: -14px;\">\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: stretch; border-top: 1px solid #D0DCE8;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 36px 12px 0;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #D32F2F;\">01<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #F0BFC4;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #16324C;\">Manual Shipping Processes<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #7A93AC; text-wrap: pretty;\">The company relied on time-consuming, manual workflows, which often led to shipping delays, higher labor costs, and increased potential for human error.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 0 12px 36px; border-left: 1px solid #D0DCE8;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #0F7B6C;\">01<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #9FE0CE;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #051729;\">Automation of Shipping Processes<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #3D5670; text-wrap: pretty;\">FreightPOP automated the company’s manual workflows, reducing delays and labor costs by minimizing human intervention.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: stretch; border-top: 1px solid #D0DCE8;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 36px 12px 0;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #D32F2F;\">02<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #F0BFC4;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #16324C;\">Limited Shipping Visibility<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #7A93AC; text-wrap: pretty;\">With limited insight into shipment status, teams struggled to effectively track and manage orders, causing potential supply chain disruptions and impacting customer satisfaction.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 0 12px 36px; border-left: 1px solid #D0DCE8;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #0F7B6C;\">02<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #9FE0CE;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #051729;\">Enhanced Shipment Visibility<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #3D5670; text-wrap: pretty;\">FreightPOP provided real-time tracking across all shipments, improving supply chain transparency and enabling proactive management of potential disruptions.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: stretch; border-top: 1px solid #D0DCE8;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 36px 12px 0;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #D32F2F;\">03<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #F0BFC4;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #16324C;\">High Shipping Costs<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #7A93AC; text-wrap: pretty;\">The company faced high shipping costs due to restricted carrier options and lacked a systematic way to optimize rates, which directly affected their bottom line.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 0 12px 36px; border-left: 1px solid #D0DCE8;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #0F7B6C;\">03<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #9FE0CE;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #051729;\">Cost Optimization<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #3D5670; text-wrap: pretty;\">By offering a platform to compare carrier rates, FreightPOP empowered the logistics team to select from hundreds of cost-effective shipping options, leading to significant savings.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: stretch; border-top: 1px solid #D0DCE8;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 36px 12px 0;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #D32F2F;\">04<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #F0BFC4;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #16324C;\">Complex International Shipping<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #7A93AC; text-wrap: pretty;\">Managing international shipments presented challenges with regulatory compliance, often leading to unexpected delays and additional costs for global distribution.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 0 12px 36px; border-left: 1px solid #D0DCE8;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #0F7B6C;\">04<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #9FE0CE;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #051729;\">Simplified International Shipping<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #3D5670; text-wrap: pretty;\">FreightPOP’s system facilitated compliance with global shipping regulations, reducing delays and costs associated with international logistics.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: stretch; border-top: 1px solid #D0DCE8;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 36px 12px 0;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #D32F2F;\">05<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #F0BFC4;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #16324C;\">ERP Integration Issues<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #7A93AC; text-wrap: pretty;\">Fragmented systems made it difficult to integrate their shipping workflows with their ERP, resulting in inefficient manual data entry and errors that slowed down operations.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 11px 0 12px 36px; border-left: 1px solid #D0DCE8;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #0F7B6C;\">05<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #9FE0CE;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 500; font-size: 17px; line-height: 1.22; letter-spacing: -0.015em; color: #051729;\">Seamless ERP Integration<\u002Fh3>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #3D5670; text-wrap: pretty;\">FreightPOP integrated smoothly with the company’s existing ERP system, eliminating manual data entry and reducing errors, thereby enhancing overall operational efficiency.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"04 Tive Integration\" style=\"display: flex; flex-direction: column; height: 11in; max-height: 11in; overflow: hidden; font-family: 'DM Sans', sans-serif; color: #051729; background: linear-gradient(to right, rgba(5,23,41,0.04) 1px, transparent 1px) 0 0 / 48px 48px, linear-gradient(to bottom, rgba(5,23,41,0.04) 1px, transparent 1px) 0 0 / 48px 48px, #FFFFFF;\">\n    <div style=\"flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 34px 56px 0;\">\n      <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #3D5670;\">Citrus Co-Op &nbsp;×&nbsp; FreightPOP<\u002Fdiv>\n      <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #7A93AC;\">04 / 05<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 34px; padding: 46px 56px 40px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #0F7B6C;\">Integration Spotlight<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 400; font-size: 42px; line-height: 1.05; letter-spacing: -0.025em;\">Tive and FreightPOP<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 18px;\">\n        <div style=\"border: 1px solid #E2EAF3; border-radius: 18px; background: linear-gradient(135deg, #F1F6FB 0%, #FFFFFF 42%, #FFFFFF 68%, #F0F8F6 100%); box-shadow: 0 1px 2px rgba(5,23,41,0.04), 0 4px 14px rgba(5,23,41,0.05); padding: 26px 26px 28px; display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #7A93AC;\">What Tive does<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.62; color: #3D5670; text-wrap: pretty;\">Tive provides real-time shipment visibility solutions, using advanced trackers to monitor location, temperature, humidity, shock, and light exposure. This ensures proactive management of logistics and product quality, particularly benefiting industries with strict environmental needs.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid #E2EAF3; border-radius: 18px; background: linear-gradient(135deg, #F1F6FB 0%, #FFFFFF 42%, #FFFFFF 68%, #F0F8F6 100%); box-shadow: 0 1px 2px rgba(5,23,41,0.04), 0 4px 14px rgba(5,23,41,0.05); padding: 26px 26px 28px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start;\">\n          <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #7A93AC; grid-column: 1 / -1;\">Monitored in transit<\u002Fdiv>\n          <div style=\"font-size: 14.5px; color: #051729; border-top: 1px solid #E2EAF3; padding-top: 8px;\">Location<\u002Fdiv>\n          <div style=\"font-size: 14.5px; color: #051729; border-top: 1px solid #E2EAF3; padding-top: 8px;\">Temperature<\u002Fdiv>\n          <div style=\"font-size: 14.5px; color: #051729; border-top: 1px solid #E2EAF3; padding-top: 8px;\">Humidity<\u002Fdiv>\n          <div style=\"font-size: 14.5px; color: #051729; border-top: 1px solid #E2EAF3; padding-top: 8px;\">Shock<\u002Fdiv>\n          <div style=\"font-size: 14.5px; color: #051729; border-top: 1px solid #E2EAF3; padding-top: 8px;\">Light exposure<\u002Fdiv>\n          <div style=\"font-size: 14.5px; color: #0F7B6C; border-top: 1px solid #E2EAF3; padding-top: 8px;\">Live alerts<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex-shrink: 0; border-radius: 20px; background: radial-gradient(70% 160% at 100% 0%, rgba(61,214,181,0.16) 0%, rgba(61,214,181,0) 62%), #051729; padding: 32px 34px 34px; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #3DD6B5;\">Why it matters for perishables<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.68; color: #C8DAE9; text-wrap: pretty;\">FreightPOP’s integration with Tive brings advanced, real-time shipment visibility to logistics operations, enhancing transparency and control over every stage of the supply chain. Tive’s innovative tracking solutions allow companies to protect sensitive goods and meet industry standards in real-time. By pairing these capabilities with FreightPOP’s centralized TMS, shippers can gain seamless access to live data and alerts, empowering them to proactively address any potential issues, minimize disruptions, and ensure safe, on-time deliveries. This integration not only optimizes shipping workflows but also supports high product quality and customer satisfaction.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"05 Insights\" style=\"display: flex; flex-direction: column; height: 11in; max-height: 11in; overflow: hidden; font-family: 'DM Sans', sans-serif; color: #051729; background: linear-gradient(to right, rgba(5,23,41,0.04) 1px, transparent 1px) 0 0 / 48px 48px, linear-gradient(to bottom, rgba(5,23,41,0.04) 1px, transparent 1px) 0 0 / 48px 48px, #FFFFFF;\">\n    <div style=\"flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 34px 56px 0;\">\n      <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #3D5670;\">Citrus Co-Op &nbsp;×&nbsp; FreightPOP<\u002Fdiv>\n      <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; color: #7A93AC;\">05 / 05<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 26px; padding: 46px 56px 40px;\">\n      <div style=\"font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #0F7B6C;\">Insights<\u002Fdiv>\n      <p style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 300; font-size: 26px; line-height: 1.42; letter-spacing: -0.015em; color: #16324C; text-wrap: pretty;\">By partnering with FreightPOP, a leading agricultural cooperative transformed its logistics operations, achieving significant cost savings, time efficiencies, and error reduction through automation and real-time visibility.<\u002Fp>\n      <div style=\"width: 64px; height: 2px; background: #3DD6B5;\"><\u002Fdiv>\n      <p style=\"margin: 0; font-size: 15.5px; line-height: 1.72; color: #3D5670; max-width: 660px; text-wrap: pretty;\">Optimized carrier selection helped lower shipping costs, while seamless ERP integration eliminated manual data entry, improving accuracy and workflow efficiency. Enhanced global compliance and streamlined cross-border processes further strengthened their logistics strategy, resulting in improved operational productivity and long-term profitability.<\u002Fp>\n    <\u002Fdiv>\n    <footer style=\"flex-shrink: 0; background: radial-gradient(60% 140% at 100% 0%, rgba(61,214,181,0.14) 0%, rgba(61,214,181,0) 60%), #051729; padding: 40px 56px 44px; display: flex; align-items: flex-end; justify-content: space-between; gap: 28px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <img src=\"df8880f2-85b6-4c79-9c84-724bf69de9f8\" alt=\"FreightPOP\" style=\"height: 24px; width: auto; align-self: flex-start; display: block;\">\n        <h2 style=\"margin: 0; font-family: Manrope, sans-serif; font-weight: 400; font-size: 30px; line-height: 1.12; letter-spacing: -0.02em; color: #FFFFFF;\">Have questions?<br>Contact us.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"text-align: right; display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-family: Manrope, sans-serif; font-size: 22px; letter-spacing: -0.01em; color: #3DD6B5;\">(949) 454-4602<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #B5CDE0;\">sales@freightpop.com<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #B5CDE0;\">www.freightpop.com<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fsection>\n\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
